plugins {
    id 'com.gradle.develocity' version '3.18.2'
    id 'com.gradle.common-custom-user-data-gradle-plugin' version '2.0.2'
}

def isCI = System.getenv('JENKINS_URL') != null

develocity {
    projectId = "fineract"
    server = "https://develocity.apache.org"
    buildScan {
        uploadInBackground = !isCI
        publishing.onlyIf { it.authenticated }
        obfuscation {
            ipAddresses { addresses ->
                addresses.collect { address ->
                    "0.0.0.0"
                }
            }
        }
    }
}

buildCache {
    local {
        enabled = true
    }
}

rootProject.name='fineract'
include ':fineract:modules:fineract-core'
include ':fineract:modules:fineract-cob'
include ':fineract:modules:fineract-validation'
include ':fineract:modules:fineract-command'
include ':fineract:modules:fineract-accounting'
include ':fineract:modules:fineract-provider'
include ':fineract:modules:fineract-branch'
include ':fineract:modules:fineract-document'
include ':fineract:modules:fineract-investor'
include ':fineract:modules:fineract-rates'
include ':fineract:modules:fineract-charge'
include ':fineract:modules:fineract-tax'
include ':fineract:modules:fineract-loan'
include ':fineract:modules:fineract-savings'
include ':fineract:modules:fineract-report'
include ':fineract:modules:fineract-war'
include ':fineract:tests:integration-tests'
include ':fineract:tests:twofactor-tests'
include ':fineract:tests:oauth2-tests'
include ':fineract:modules:fineract-client'
include ':fineract:modules:fineract-doc'
include ':fineract:modules:fineract-avro-schemas'
include ':fineract:modules:fineract-e2e-tests-core'
include ':fineract:modules:fineract-e2e-tests-runner'
include ':fineract:modules:fineract-progressive-loan'
include ':fineract:modules:fineract-progressive-loan-embeddable-schedule-generator'
// NOTE: custom Docker image with all custom modules included
include ':fineract:custom:docker'
// NOTE: dynamically load custom modules with pattern "custom -> company -> category -> module"
file("${rootDir}/fineract/custom").eachDir { companyDir ->
    if('build' != companyDir.name && 'docker' != companyDir.name) {
        file("${rootDir}/fineract/custom/${companyDir.name}").eachDir { categoryDir ->
            if('build' != categoryDir.name) {
                file("${rootDir}/fineract/custom/${companyDir.name}/${categoryDir.name}").eachDir { moduleDir ->
                    if('build' != moduleDir.name) {
                        include ":fineract:custom:${companyDir.name}:${categoryDir.name}:${moduleDir.name}"
                    }
                }
            }
        }
    }
}
