name: Create Phase 3 GitHub Issues

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "create" to confirm issue creation'
        required: true
        default: ''

jobs:
  create-labels:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'create'
    steps:
      - name: Create Phase 3 Labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'phase-3', color: '0e8a16', description: 'Phase 3: Frontend & Features' },
              { name: 'admin-dashboard', color: '00897b', description: 'Admin Dashboard tasks' },
              { name: 'distributor-portal', color: '00897b', description: 'Distributor Portal tasks' },
              { name: 'whatsapp-features', color: '00897b', description: 'WhatsApp features' },
              { name: 'credit-scoring', color: '00897b', description: 'Credit scoring tasks' },
              { name: 'payments', color: '00897b', description: 'Payment features' },
              { name: 'device-management', color: '00897b', description: 'Device management' },
              { name: 'analytics', color: '00897b', description: 'Analytics & BI' },
              { name: 'operations', color: '00897b', description: 'Operational improvements' },
              { name: 'compliance', color: '00897b', description: 'Compliance & reporting' },
              { name: 'frontend', color: '1d76db', description: 'Frontend implementation' },
              { name: 'tdd', color: 'd73a4a', description: 'Test-Driven Development' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`Created label: ${label.name}`);
              } catch (error) {
                if (error.status === 422) {
                  console.log(`Label already exists: ${label.name}`);
                } else {
                  throw error;
                }
              }
            }

  create-issues:
    needs: create-labels
    runs-on: ubuntu-latest
    steps:
      # ============================================
      # CATEGORY 1: ADMIN DASHBOARD (P3-T001 to P3-T010)
      # ============================================

      - name: Create P3-T001 Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'P3-T001: Core Setup & Layout',
              labels: ['phase-3', 'priority: critical', 'admin-dashboard', 'frontend', 'tdd'],
              body: `## Task Overview
**Priority:** 🔴 Critical | **Estimate:** 12 hours | **Phase:** Phase 3
