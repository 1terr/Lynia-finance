name: Run Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development

concurrency:
  group: db-migrations-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy-codebuild-stack:
    name: Ensure CodeBuild project exists (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      codebuild_project: ${{ steps.stack.outputs.project_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CodeBuild migrations stack
        id: stack
        run: |
          ENV="${{ github.event.inputs.environment }}"
          STACK_NAME="${ENV}-lynia-codebuild-migrations"

          # Check if stack exists and is in a deployable state
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "Stack status: ${STACK_STATUS}"

          if [ "${STACK_STATUS}" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack in ROLLBACK_COMPLETE — deleting..."
            aws cloudformation delete-stack --stack-name "${STACK_NAME}"
            aws cloudformation wait stack-delete-complete --stack-name "${STACK_NAME}"
            STACK_STATUS="DOES_NOT_EXIST"
          fi

          # Deploy or update the stack
          if [ "${STACK_STATUS}" = "DOES_NOT_EXIST" ]; then
            echo "Creating CodeBuild migrations stack..."
            aws cloudformation create-stack \
              --stack-name "${STACK_NAME}" \
              --template-body file://infrastructure/aws/codebuild-migrations.yaml \
              --parameters \
                ParameterKey=Environment,ParameterValue="${ENV}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --tags Key=Environment,Value="${ENV}" Key=Service,Value=lynia-finance
            aws cloudformation wait stack-create-complete --stack-name "${STACK_NAME}"
          elif [ "${STACK_STATUS}" = "CREATE_COMPLETE" ] || [ "${STACK_STATUS}" = "UPDATE_COMPLETE" ] || [ "${STACK_STATUS}" = "UPDATE_ROLLBACK_COMPLETE" ]; then
            echo "Updating CodeBuild migrations stack..."
            aws cloudformation update-stack \
              --stack-name "${STACK_NAME}" \
              --template-body file://infrastructure/aws/codebuild-migrations.yaml \
              --parameters \
                ParameterKey=Environment,ParameterValue="${ENV}" \
              --capabilities CAPABILITY_NAMED_IAM 2>/dev/null && \
            aws cloudformation wait stack-update-complete --stack-name "${STACK_NAME}" || \
            echo "No updates needed or update skipped."
          fi

          # Get the CodeBuild project name
          PROJECT_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='CodeBuildProjectName'].OutputValue" \
            --output text)
          echo "project_name=${PROJECT_NAME}" >> $GITHUB_OUTPUT
          echo "CodeBuild project: ${PROJECT_NAME}"

  run-migrations:
    name: Run DB Migrations via CodeBuild (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: deploy-codebuild-stack

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get RDS endpoint
        id: rds
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ "${ENV}" = "production" ]; then
            RDS_STACK="lynia-rds-production"
          else
            RDS_STACK="${ENV}-lynia-rds"
          fi

          echo "=== Fetching RDS details from ${RDS_STACK} ==="
          RDS_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${RDS_STACK}" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          if [ "${RDS_STATUS}" != "CREATE_COMPLETE" ] && [ "${RDS_STATUS}" != "UPDATE_COMPLETE" ]; then
            echo "::error::RDS stack ${RDS_STACK} not ready (status: ${RDS_STATUS})"
            exit 1
          fi

          DB_HOST=$(aws cloudformation describe-stacks --stack-name "${RDS_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" --output text)
          DB_PORT=$(aws cloudformation describe-stacks --stack-name "${RDS_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabasePort'].OutputValue" --output text 2>/dev/null || echo "5432")

          echo "DB_HOST=${DB_HOST}"
          echo "DB_PORT=${DB_PORT:-5432}"

          echo "db_host=${DB_HOST}" >> $GITHUB_OUTPUT
          echo "db_port=${DB_PORT:-5432}" >> $GITHUB_OUTPUT

      - name: Upload migration source to S3
        run: |
          echo "=== Packaging migration source ==="
          # Create a zip of the repo root so buildspec + database/ are available
          zip -r /tmp/source.zip database/ -x "*.git*"
          aws s3 cp /tmp/source.zip s3://lynia-finance-production-templates/db-migrations/source.zip
          echo "Source uploaded to S3."

      - name: Start CodeBuild migration
        id: codebuild
        run: |
          PROJECT="${{ needs.deploy-codebuild-stack.outputs.codebuild_project }}"
          DB_HOST="${{ steps.rds.outputs.db_host }}"
          DB_PORT="${{ steps.rds.outputs.db_port }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

          echo "=== Starting CodeBuild build: ${PROJECT} ==="
          BUILD_ID=$(aws codebuild start-build \
            --project-name "${PROJECT}" \
            --source-type-override S3 \
            --source-location-override "lynia-finance-production-templates/db-migrations/source.zip" \
            --environment-variables-override \
              "name=DB_HOST,value=${DB_HOST},type=PLAINTEXT" \
              "name=DB_PORT,value=${DB_PORT},type=PLAINTEXT" \
              "name=DB_PASSWORD,value=${DB_PASSWORD},type=PLAINTEXT" \
            --query "build.id" --output text)

          echo "Build started: ${BUILD_ID}"
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT

      - name: Wait for CodeBuild completion
        id: wait
        run: |
          BUILD_ID="${{ steps.codebuild.outputs.build_id }}"
          echo "Waiting for build ${BUILD_ID}..."

          # Poll every 15 seconds for up to 15 minutes
          for i in $(seq 1 60); do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "${BUILD_ID}" \
              --query "builds[0].buildStatus" --output text)

            if [ "${STATUS}" != "IN_PROGRESS" ]; then
              echo "Build finished with status: ${STATUS}"
              echo "build_status=${STATUS}" >> $GITHUB_OUTPUT

              # Get build logs URL
              LOG_GROUP=$(aws codebuild batch-get-builds \
                --ids "${BUILD_ID}" \
                --query "builds[0].logs.groupName" --output text)
              LOG_STREAM=$(aws codebuild batch-get-builds \
                --ids "${BUILD_ID}" \
                --query "builds[0].logs.streamName" --output text)
              echo "Logs: ${LOG_GROUP}/${LOG_STREAM}"

              # Print last 50 lines of build log
              aws logs get-log-events \
                --log-group-name "${LOG_GROUP}" \
                --log-stream-name "${LOG_STREAM}" \
                --limit 50 \
                --query "events[].message" --output text 2>/dev/null || true

              if [ "${STATUS}" = "SUCCEEDED" ]; then
                echo "Migration completed successfully!"
                exit 0
              else
                echo "::error::Migration build failed with status: ${STATUS}"
                exit 1
              fi
            fi

            echo "  Still running... (${i}/60)"
            sleep 15
          done

          echo "::error::Build timed out after 15 minutes"
          exit 1

      - name: Verify database state
        if: success()
        run: |
          echo "=== Database migration completed via CodeBuild ==="
          echo "Build ID: ${{ steps.codebuild.outputs.build_id }}"
          echo "Status: ${{ steps.wait.outputs.build_status }}"

      - name: Generate summary
        if: always()
        run: |
          ENV="${{ github.event.inputs.environment }}"
          BUILD_STATUS="${{ steps.wait.outputs.build_status || 'UNKNOWN' }}"

          if [ "${BUILD_STATUS}" = "SUCCEEDED" ]; then
            RESULT="PASS"
          else
            RESULT="FAIL"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Database Migrations — ${ENV}

          ## Execution Method
          **CodeBuild (VPC-attached)** — runs inside private subnets with direct RDS access.

          ## Migration Pipeline
          | Phase | Script | Status |
          |-------|--------|--------|
          | Pre-migration | 000_pre_migration.sql | ${RESULT} |
          | Standard (001-017) | 17 migration files | ${RESULT} |
          | Post-migration | 018_remove_rls_for_aws.sql | ${RESULT} |

          ## Build Details
          | Field | Value |
          |-------|-------|
          | Build ID | ${{ steps.codebuild.outputs.build_id }} |
          | Status | ${BUILD_STATUS} |
          | Project | ${{ needs.deploy-codebuild-stack.outputs.codebuild_project }} |

          ## Architecture
          GitHub Actions → S3 (source upload) → CodeBuild (VPC) → RDS (private subnet)

          No direct internet-to-RDS connection required.
          EOF

          if [ "${RESULT}" = "FAIL" ]; then
            echo "::error::Migration failed — check CodeBuild logs"
            exit 1
          fi

          echo "All migrations applied successfully!"
