name: Deploy Secrets Manager

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development

concurrency:
  group: deploy-secrets-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy-secrets:
    name: Deploy Secrets Manager (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          echo "Validating infrastructure/aws/secrets-manager.yaml..."
          aws cloudformation validate-template \
            --template-body file://infrastructure/aws/secrets-manager.yaml
          echo "Template validation passed"

      - name: Get RDS endpoint from T004
        id: rds
        run: |
          ENV="${{ github.event.inputs.environment }}"
          RDS_STACK="${ENV}-lynia-rds"

          echo "=== Fetching RDS endpoint from ${RDS_STACK} ==="
          RDS_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${RDS_STACK}" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          if [ "${RDS_STATUS}" = "CREATE_COMPLETE" ] || [ "${RDS_STATUS}" = "UPDATE_COMPLETE" ]; then
            DB_HOST=$(aws cloudformation describe-stacks --stack-name "${RDS_STACK}" \
              --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" --output text)
            echo "PASS: RDS stack found (status: ${RDS_STATUS})"
            echo "DB_HOST=${DB_HOST}"
            echo "db_host=${DB_HOST}" >> $GITHUB_OUTPUT
          else
            echo "::error::RDS stack ${RDS_STACK} not found or not ready (status: ${RDS_STATUS})"
            echo "T004 (Deploy RDS) must be completed before T007 (Secrets Manager)"
            exit 1
          fi

      - name: Clean up failed stack if needed
        run: |
          ENV="${{ github.event.inputs.environment }}"
          STACK_NAME="${ENV}-lynia-secrets"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "Current stack status: ${STACK_STATUS}"

          if [ "${STACK_STATUS}" = "ROLLBACK_COMPLETE" ] || [ "${STACK_STATUS}" = "CREATE_FAILED" ] || [ "${STACK_STATUS}" = "DELETE_FAILED" ]; then
            echo "Stack in ${STACK_STATUS} state — deleting before re-deploy..."
            aws cloudformation describe-stack-events \
              --stack-name "${STACK_NAME}" \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].{Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              --output table 2>/dev/null || echo "(no events available)"

            aws cloudformation delete-stack --stack-name "${STACK_NAME}"
            aws cloudformation wait stack-delete-complete --stack-name "${STACK_NAME}"
            echo "Stack deleted successfully"
          elif [ "${STACK_STATUS}" = "DOES_NOT_EXIST" ]; then
            echo "Stack does not exist yet — will create"
          else
            echo "Stack exists in state: ${STACK_STATUS}"
          fi

      - name: Deploy Secrets Manager stack
        id: deploy
        run: |
          ENV="${{ github.event.inputs.environment }}"
          STACK_NAME="${ENV}-lynia-secrets"
          DB_HOST="${{ steps.rds.outputs.db_host }}"
          echo "Deploying stack: ${STACK_NAME}"
          echo "stack_name=${STACK_NAME}" >> $GITHUB_OUTPUT

          set +e
          aws cloudformation deploy \
            --template-file infrastructure/aws/secrets-manager.yaml \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              "Environment=${ENV}" \
              "DBHost=${DB_HOST}" \
              "DBPort=5432" \
              "DBName=lynia" \
              "DBUsername=lynia_admin" \
              "DBPassword=${{ secrets.DB_PASSWORD }}" \
              "WhatsAppPhoneNumberId=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" \
              "WhatsAppAccessToken=${{ secrets.WHATSAPP_ACCESS_TOKEN }}" \
              "WhatsAppWebhookVerifyToken=${{ secrets.WHATSAPP_WEBHOOK_TOKEN }}" \
              "DiditApiKey=${{ secrets.DIDIT_API_KEY }}" \
              "DiditWebhookSecret=${{ secrets.DIDIT_WEBHOOK_SECRET }}" \
              "EcocashMerchantId=${{ secrets.ECOCASH_MERCHANT_ID }}" \
              "EcocashApiKey=${{ secrets.ECOCASH_API_KEY }}" \
              "OnemoneyMerchantId=${{ secrets.ONEMONEY_MERCHANT_ID }}" \
              "OnemoneyApiKey=${{ secrets.ONEMONEY_API_KEY }}" \
              "TrustonicApiKey=${{ secrets.TRUSTONIC_API_KEY }}" \
              "TrustonicApiSecret=${{ secrets.TRUSTONIC_API_SECRET }}" \
              "SmsApiKey=${{ secrets.SMS_API_KEY }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --tags "Project=lynia-finance" "Environment=${ENV}" "Service=secrets" "Layer=security" "ManagedBy=cloudformation" \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }}
          DEPLOY_EXIT=$?
          set -e

          if [ "${DEPLOY_EXIT}" -ne 0 ]; then
            echo "::error::CloudFormation deploy failed (exit code ${DEPLOY_EXIT})"
            aws cloudformation describe-stack-events \
              --stack-name "${STACK_NAME}" \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].{Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              --output table 2>/dev/null || echo "(could not fetch stack events)"
            exit 1
          fi

      - name: Extract stack outputs
        id: outputs
        run: |
          STACK_NAME="${{ steps.deploy.outputs.stack_name }}"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' --output text)
          echo "Stack status: ${STACK_STATUS}"
          echo "stack_status=${STACK_STATUS}" >> $GITHUB_OUTPUT

          # Count outputs
          SECRET_COUNT=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?contains(OutputKey,'SecretArn')] | length(@)" --output text)
          POLICY_COUNT=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?contains(OutputKey,'PolicyArn')] | length(@)" --output text)
          echo "Secret ARN outputs: ${SECRET_COUNT}"
          echo "Policy ARN outputs: ${POLICY_COUNT}"
          echo "secret_count=${SECRET_COUNT}" >> $GITHUB_OUTPUT
          echo "policy_count=${POLICY_COUNT}" >> $GITHUB_OUTPUT

      - name: Verify secrets
        id: verify-secrets
        run: |
          ENV="${{ github.event.inputs.environment }}"
          PASS=0
          FAIL=0

          echo "=== Verifying Secrets ==="

          SECRETS=$(aws secretsmanager list-secrets \
            --filters "Key=name,Values=${ENV}/lynia" \
            --query 'SecretList[].Name' --output json 2>/dev/null || echo "[]")

          SECRET_COUNT=$(echo "${SECRETS}" | jq 'length')
          if [ "${SECRET_COUNT}" -ge 7 ]; then
            echo "PASS: ${SECRET_COUNT} secrets found (expected 7+)"
            PASS=$((PASS + 1))
          else
            echo "FAIL: ${SECRET_COUNT} secrets found (expected 7+)"
            FAIL=$((FAIL + 1))
          fi

          for NAME in database whatsapp didit ecocash onemoney trustonic sms; do
            FULL_NAME="${ENV}/lynia/${NAME}"
            EXISTS=$(echo "${SECRETS}" | jq -r ".[] | select(. == \"${FULL_NAME}\")")
            if [ -n "${EXISTS}" ]; then
              echo "PASS: ${FULL_NAME}"
              PASS=$((PASS + 1))
            else
              echo "FAIL: ${FULL_NAME} not found"
              FAIL=$((FAIL + 1))
            fi
          done

          echo "secrets_pass=${PASS}" >> $GITHUB_OUTPUT
          echo "secrets_fail=${FAIL}" >> $GITHUB_OUTPUT

      - name: Verify IAM policies
        id: verify-policies
        run: |
          STACK_NAME="${{ steps.deploy.outputs.stack_name }}"
          PASS=0
          FAIL=0

          echo "=== Verifying IAM Policies ==="

          for KEY in SharedSecretsPolicyArn WhatsAppSecretsPolicyArn KYCSecretsPolicyArn PaymentSecretsPolicyArn LockSecretsPolicyArn NotificationSecretsPolicyArn; do
            ARN=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='${KEY}'].OutputValue" --output text 2>/dev/null || echo "")

            if [ -n "${ARN}" ] && [ "${ARN}" != "None" ]; then
              echo "PASS: ${KEY}"
              PASS=$((PASS + 1))
            else
              echo "FAIL: ${KEY} not found"
              FAIL=$((FAIL + 1))
            fi
          done

          echo "policy_pass=${PASS}" >> $GITHUB_OUTPUT
          echo "policy_fail=${FAIL}" >> $GITHUB_OUTPUT

      - name: Verify database secret structure
        id: verify-db
        run: |
          ENV="${{ github.event.inputs.environment }}"
          PASS=0
          FAIL=0

          echo "=== Verifying Database Secret Structure ==="

          DB_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${ENV}/lynia/database" \
            --query "SecretString" --output text 2>/dev/null || echo "{}")

          for FIELD in host port database username password; do
            HAS_FIELD=$(echo "${DB_SECRET}" | jq -r "has(\"${FIELD}\")")
            if [ "${HAS_FIELD}" = "true" ]; then
              echo "PASS: database secret has '${FIELD}' field"
              PASS=$((PASS + 1))
            else
              echo "FAIL: database secret missing '${FIELD}' field"
              FAIL=$((FAIL + 1))
            fi
          done

          echo "db_pass=${PASS}" >> $GITHUB_OUTPUT
          echo "db_fail=${FAIL}" >> $GITHUB_OUTPUT

      - name: Generate summary
        if: always()
        run: |
          ENV="${{ github.event.inputs.environment }}"
          DEPLOY_OUTCOME="${{ steps.deploy.outcome }}"
          STACK_STATUS="${{ steps.outputs.outputs.stack_status }}"
          SECRETS_PASS="${{ steps.verify-secrets.outputs.secrets_pass || 0 }}"
          SECRETS_FAIL="${{ steps.verify-secrets.outputs.secrets_fail || 0 }}"
          POLICY_PASS="${{ steps.verify-policies.outputs.policy_pass || 0 }}"
          POLICY_FAIL="${{ steps.verify-policies.outputs.policy_fail || 0 }}"
          DB_PASS="${{ steps.verify-db.outputs.db_pass || 0 }}"
          DB_FAIL="${{ steps.verify-db.outputs.db_fail || 0 }}"

          TOTAL_PASS=$((SECRETS_PASS + POLICY_PASS + DB_PASS))
          TOTAL_FAIL=$((SECRETS_FAIL + POLICY_FAIL + DB_FAIL))

          if [ "${DEPLOY_OUTCOME}" != "success" ]; then
            STACK_CHECK="FAIL"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          elif [ "${STACK_STATUS}" = "CREATE_COMPLETE" ] || [ "${STACK_STATUS}" = "UPDATE_COMPLETE" ]; then
            STACK_CHECK="PASS"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            STACK_CHECK="FAIL"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          TOTAL=$((TOTAL_PASS + TOTAL_FAIL))

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Secrets Manager Deployment — ${ENV}

          ## Stack Info
          | Property | Value |
          |----------|-------|
          | Stack Name | \`${ENV}-lynia-secrets\` |
          | Stack Status | ${STACK_CHECK} ${STACK_STATUS} |
          | Region | ${{ env.AWS_REGION }} |

          ## Secrets Inventory
          | Secret | Service | Contents |
          |--------|---------|----------|
          | database | All | host, port, db, user, pass |
          | whatsapp | WhatsApp | phone_id, token, webhook |
          | didit | KYC | api_key, webhook_secret |
          | ecocash | Payment | merchant_id, api_key |
          | onemoney | Payment | merchant_id, api_key |
          | trustonic | Lock | api_key, api_secret |
          | sms | Notification | api_key |

          ## IAM Policies
          | Policy | Access Scope |
          |--------|-------------|
          | SharedSecretsPolicy | database |
          | WhatsAppSecretsPolicy | database, whatsapp |
          | KYCSecretsPolicy | database, didit |
          | PaymentSecretsPolicy | database, ecocash, onemoney |
          | LockSecretsPolicy | database, trustonic |
          | NotificationSecretsPolicy | database, sms |

          ## Acceptance Criteria: ${TOTAL_PASS}/${TOTAL} passed
          | Check | Result |
          |-------|--------|
          | Stack status | ${STACK_CHECK} |
          | Secrets (pass: ${SECRETS_PASS}, fail: ${SECRETS_FAIL}) | $([ "${SECRETS_FAIL}" = "0" ] && echo "PASS" || echo "FAIL") |
          | IAM policies (pass: ${POLICY_PASS}, fail: ${POLICY_FAIL}) | $([ "${POLICY_FAIL}" = "0" ] && echo "PASS" || echo "FAIL") |
          | DB secret structure (pass: ${DB_PASS}, fail: ${DB_FAIL}) | $([ "${DB_FAIL}" = "0" ] && echo "PASS" || echo "FAIL") |

          **Total: ${TOTAL_PASS} passed, ${TOTAL_FAIL} failed out of ${TOTAL} checks**

          ## Required GitHub Secrets
          \`\`\`
          DB_PASSWORD, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_ACCESS_TOKEN,
          WHATSAPP_WEBHOOK_TOKEN, DIDIT_API_KEY, DIDIT_WEBHOOK_SECRET,
          ECOCASH_MERCHANT_ID, ECOCASH_API_KEY, ONEMONEY_MERCHANT_ID,
          ONEMONEY_API_KEY, TRUSTONIC_API_KEY, TRUSTONIC_API_SECRET, SMS_API_KEY
          \`\`\`

          ## Next Steps
          - Policy ARNs are needed by **P5-DEPLOY-T010** (SAM Lambda Deploy) for Lambda execution role policies
          EOF

          if [ "${TOTAL_FAIL}" -gt 0 ]; then
            echo "::error::${TOTAL_FAIL} acceptance criteria failed"
            exit 1
          fi

          echo "All ${TOTAL_PASS} acceptance criteria passed!"
