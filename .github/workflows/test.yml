name: Test & Build

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  NODE_ENV: test
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9'
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint
        continue-on-error: true

      - name: Run tests with coverage
        run: pnpm run test:coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_KEY }}

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Lambda Functions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install esbuild globally
        run: npm install -g esbuild

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: SAM Build
        run: sam build --cached --parallel
        env:
          SAM_CLI_TELEMETRY: 0

      - name: SAM Validate
        run: sam validate --lint

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sam-build
          path: .aws-sam/build/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: sam-build
          path: .aws-sam/build/

      - name: Start SAM Local API
        run: |
          sam local start-api --port 3000 --env-vars env.json &
          sleep 30
        env:
          SAM_CLI_TELEMETRY: 0

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          API_BASE_URL: http://localhost:3000
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_KEY }}

      - name: Stop SAM Local
        if: always()
        run: pkill -f "sam local start-api"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test, build, e2e-tests]
    if: always()

    steps:
      - name: Send success notification
        if: success()
        run: echo "✅ All tests passed and build successful!"

      - name: Send failure notification
        if: failure()
        run: echo "❌ Tests failed or build error. Check logs."
