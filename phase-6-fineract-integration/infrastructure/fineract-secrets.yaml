AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lynia Finance - Phase 6: Fineract Secrets Manager + Database Initialization
  Stores Fineract credentials and provides DB init script for fineract_tenants / fineract_default

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - development
      - staging
      - production

  FineractDBUsername:
    Type: String
    Default: fineract_admin
    NoEcho: true
    Description: Dedicated PostgreSQL user for Fineract (not the Lynia admin user)

  FineractDBPassword:
    Type: String
    NoEcho: true
    Description: Password for the Fineract database user

  FineractMasterPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Fineract encryption master password for tenant secrets

  FineractBasicAuthUsername:
    Type: String
    Default: mifos
    NoEcho: true
    Description: Fineract API basic-auth username (service-to-service)

  FineractBasicAuthPassword:
    Type: String
    NoEcho: true
    Description: Fineract API basic-auth password

Resources:
  # ==========================================================
  # FINERACT DATABASE CREDENTIALS
  # ==========================================================
  FineractDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/lynia/fineract"
      Description: Apache Fineract database and API credentials
      SecretString: !Sub |
        {
          "db_host": "${!ImportValue ${Environment}-lynia-db-endpoint}",
          "db_port": "5432",
          "db_username": "${FineractDBUsername}",
          "db_password": "${FineractDBPassword}",
          "jdbc_url": "jdbc:postgresql://${!ImportValue ${Environment}-lynia-db-endpoint}:5432/fineract_tenants",
          "master_password": "${FineractMasterPassword}",
          "api_username": "${FineractBasicAuthUsername}",
          "api_password": "${FineractBasicAuthPassword}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: fineract

  # ==========================================================
  # FINERACT API ENDPOINT SECRET
  # ==========================================================
  FineractEndpointSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/lynia/fineract-api"
      Description: Fineract API connection details for Lambda services
      SecretString: !Sub
        - |
          {
            "base_url": "https://${FineractEndpoint}:8443/fineract-provider/api/v1",
            "username": "${FineractBasicAuthUsername}",
            "password": "${FineractBasicAuthPassword}",
            "tenant_id": "default"
          }
        - FineractEndpoint: !ImportValue
            Fn::Sub: "${Environment}-lynia-fineract-endpoint"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: fineract-api

  # ==========================================================
  # SECRET ROTATION (90-day cycle)
  # ==========================================================
  FineractSecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Condition: EnableRotation
    Properties:
      SecretId: !Ref FineractDatabaseSecret
      RotationRules:
        AutomaticallyAfterDays: 90

Conditions:
  EnableRotation: !Equals [!Ref Environment, production]

Outputs:
  FineractDatabaseSecretArn:
    Description: ARN of the Fineract database secret
    Value: !Ref FineractDatabaseSecret
    Export:
      Name: !Sub "${Environment}-lynia-fineract-db-secret-arn"

  FineractAPISecretArn:
    Description: ARN of the Fineract API endpoint secret
    Value: !Ref FineractEndpointSecret
    Export:
      Name: !Sub "${Environment}-lynia-fineract-api-secret-arn"
