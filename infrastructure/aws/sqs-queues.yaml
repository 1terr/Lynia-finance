AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lynia Finance - SQS Queues for Asynchronous Processing
  Decoupled messaging for notifications, payment callbacks, KYC processing, and device lock operations

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - development
      - staging
      - production

Conditions:
  IsProduction: !Equals [!Ref Environment, production]

Resources:
  # ==========================================================
  # 1. NOTIFICATION QUEUE
  # ==========================================================

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-notifications"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20  # Long polling
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: notification-service

  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-notifications-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: dead-letter

  # ==========================================================
  # 2. PAYMENT CALLBACK QUEUE
  # ==========================================================

  PaymentCallbackQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-payment-callbacks"
      VisibilityTimeout: 120  # Longer for payment processing
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PaymentCallbackDLQ.Arn
        maxReceiveCount: 5  # More retries for payments
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payment-service

  PaymentCallbackDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-payment-callbacks-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: dead-letter

  # ==========================================================
  # 3. KYC PROCESSING QUEUE
  # ==========================================================

  KYCProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-kyc-processing"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt KYCProcessingDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: kyc-service

  KYCProcessingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-kyc-processing-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: dead-letter

  # ==========================================================
  # 4. DEVICE LOCK QUEUE
  # ==========================================================

  DeviceLockQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-device-locks"
      VisibilityTimeout: 90
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeviceLockDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: lock-service

  DeviceLockDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-device-locks-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: dead-letter

  # ==========================================================
  # 5. WHATSAPP MESSAGE RETRY QUEUE
  # ==========================================================

  WhatsAppMessageRetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-whatsapp-message-retry"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20  # Long polling
      DelaySeconds: 30  # Delay before first delivery to allow transient issues to resolve
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WhatsAppMessageRetryDLQ.Arn
        maxReceiveCount: 5  # More retries for messages
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: whatsapp-service

  WhatsAppMessageRetryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-whatsapp-message-retry-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: dead-letter

  # ==========================================================
  # 6. CREDIT SCORING QUEUE
  # ==========================================================

  CreditScoringQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-credit-scoring"
      VisibilityTimeout: 90
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CreditScoringDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: scoring-service

  CreditScoringDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-credit-scoring-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: dead-letter

  # ==========================================================
  # 7. FINERACT SYNC RETRY QUEUE
  # ==========================================================

  FineractSyncRetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-fineract-sync-retry"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 604800  # 7 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FineractSyncRetryDLQ.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: fineract-sync

  FineractSyncRetryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-fineract-sync-retry-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: dead-letter

  # ==========================================================
  # 8. DATA WAREHOUSE REAL-TIME SYNC QUEUE
  # ==========================================================

  DWSyncQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-dw-sync"
      VisibilityTimeout: 120  # Longer for multi-statement SQL processing
      MessageRetentionPeriod: 345600  # 4 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DWSyncDLQ.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: dw-sync-service

  DWSyncDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-dw-sync-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: dead-letter

  # ==========================================================
  # 9. PAYMENT COMPENSATION QUEUE
  # ==========================================================

  PaymentCompensationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-payment-compensation"
      VisibilityTimeout: 300  # 5 min — compensation handlers may poll providers
      MessageRetentionPeriod: 604800  # 7 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PaymentCompensationDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payment-service

  PaymentCompensationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-lynia-payment-compensation-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: dead-letter

  # ==========================================================
  # DLQ ALARM (alert on DLQ messages)
  # ==========================================================

  PaymentDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-lynia-payment-dlq-messages"
      AlarmDescription: "Payment DLQ has messages - failed payment processing detected"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PaymentCallbackDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  NotificationDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-lynia-notification-dlq-messages"
      AlarmDescription: "Notification DLQ has messages - failed notification processing detected"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  KYCProcessingDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-lynia-kyc-dlq-messages"
      AlarmDescription: "KYC DLQ has messages - failed KYC processing detected"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt KYCProcessingDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DeviceLockDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-lynia-device-lock-dlq-messages"
      AlarmDescription: "Device Lock DLQ has messages - failed device lock processing detected"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeviceLockDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CreditScoringDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-lynia-credit-scoring-dlq-messages"
      AlarmDescription: "Credit Scoring DLQ has messages - failed scoring processing detected"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CreditScoringDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  WhatsAppMessageRetryDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-lynia-whatsapp-message-retry-dlq-messages"
      AlarmDescription: "WhatsApp Message Retry DLQ has messages - failed message delivery detected"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WhatsAppMessageRetryDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FineractSyncRetryDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-lynia-fineract-sync-retry-dlq-messages"
      AlarmDescription: "Fineract Sync Retry DLQ has messages - exhausted sync retries detected"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FineractSyncRetryDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DWSyncDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-lynia-dw-sync-dlq-messages"
      AlarmDescription: "DW Sync DLQ has messages - failed data warehouse sync detected"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DWSyncDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  PaymentCompensationDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-lynia-payment-compensation-dlq-messages"
      AlarmDescription: "Payment Compensation DLQ has messages - unresolvable payment failures detected"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PaymentCompensationDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  NotificationQueueUrl:
    Description: Notification queue URL
    Value: !Ref NotificationQueue
    Export:
      Name: !Sub "${Environment}-lynia-notification-queue-url"

  NotificationQueueArn:
    Description: Notification queue ARN
    Value: !GetAtt NotificationQueue.Arn
    Export:
      Name: !Sub "${Environment}-lynia-notification-queue-arn"

  PaymentCallbackQueueUrl:
    Description: Payment callback queue URL
    Value: !Ref PaymentCallbackQueue
    Export:
      Name: !Sub "${Environment}-lynia-payment-callback-queue-url"

  PaymentCallbackQueueArn:
    Description: Payment callback queue ARN
    Value: !GetAtt PaymentCallbackQueue.Arn
    Export:
      Name: !Sub "${Environment}-lynia-payment-callback-queue-arn"

  KYCProcessingQueueUrl:
    Description: KYC processing queue URL
    Value: !Ref KYCProcessingQueue
    Export:
      Name: !Sub "${Environment}-lynia-kyc-processing-queue-url"

  KYCProcessingQueueArn:
    Description: KYC processing queue ARN
    Value: !GetAtt KYCProcessingQueue.Arn
    Export:
      Name: !Sub "${Environment}-lynia-kyc-processing-queue-arn"

  DeviceLockQueueUrl:
    Description: Device lock queue URL
    Value: !Ref DeviceLockQueue
    Export:
      Name: !Sub "${Environment}-lynia-device-lock-queue-url"

  DeviceLockQueueArn:
    Description: Device lock queue ARN
    Value: !GetAtt DeviceLockQueue.Arn
    Export:
      Name: !Sub "${Environment}-lynia-device-lock-queue-arn"

  CreditScoringQueueUrl:
    Description: Credit scoring queue URL
    Value: !Ref CreditScoringQueue
    Export:
      Name: !Sub "${Environment}-lynia-credit-scoring-queue-url"

  CreditScoringQueueArn:
    Description: Credit scoring queue ARN
    Value: !GetAtt CreditScoringQueue.Arn
    Export:
      Name: !Sub "${Environment}-lynia-credit-scoring-queue-arn"

  WhatsAppMessageRetryQueueUrl:
    Description: WhatsApp message retry queue URL
    Value: !Ref WhatsAppMessageRetryQueue
    Export:
      Name: !Sub "${Environment}-lynia-whatsapp-message-retry-queue-url"

  WhatsAppMessageRetryQueueArn:
    Description: WhatsApp message retry queue ARN
    Value: !GetAtt WhatsAppMessageRetryQueue.Arn
    Export:
      Name: !Sub "${Environment}-lynia-whatsapp-message-retry-queue-arn"

  FineractSyncRetryQueueUrl:
    Description: Fineract sync retry queue URL
    Value: !Ref FineractSyncRetryQueue
    Export:
      Name: !Sub "${Environment}-lynia-fineract-sync-retry-queue-url"

  FineractSyncRetryQueueArn:
    Description: Fineract sync retry queue ARN
    Value: !GetAtt FineractSyncRetryQueue.Arn
    Export:
      Name: !Sub "${Environment}-lynia-fineract-sync-retry-queue-arn"

  DWSyncQueueUrl:
    Description: DW sync queue URL
    Value: !Ref DWSyncQueue
    Export:
      Name: !Sub "${Environment}-lynia-dw-sync-queue-url"

  DWSyncQueueArn:
    Description: DW sync queue ARN
    Value: !GetAtt DWSyncQueue.Arn
    Export:
      Name: !Sub "${Environment}-lynia-dw-sync-queue-arn"

  PaymentCompensationQueueUrl:
    Description: Payment compensation queue URL
    Value: !Ref PaymentCompensationQueue
    Export:
      Name: !Sub "${Environment}-lynia-payment-compensation-queue-url"

  PaymentCompensationQueueArn:
    Description: Payment compensation queue ARN
    Value: !GetAtt PaymentCompensationQueue.Arn
    Export:
      Name: !Sub "${Environment}-lynia-payment-compensation-queue-arn"
