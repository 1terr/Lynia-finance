AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lynia Finance - AWS Secrets Manager Configuration
  Centralized secret management for all Lambda functions with IAM-based access control

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - development
      - staging
      - production

  # Database (RDS PostgreSQL)
  DBHost:
    Type: String
    Description: RDS database endpoint
  DBPort:
    Type: String
    Default: "5432"
  DBName:
    Type: String
    Default: lynia
  DBUsername:
    Type: String
    NoEcho: true
    Default: lynia_admin
  DBPassword:
    Type: String
    NoEcho: true

  # WhatsApp Cloud API
  WhatsAppPhoneNumberId:
    Type: String
    NoEcho: true
    Default: ""
  WhatsAppAccessToken:
    Type: String
    NoEcho: true
    Default: ""
  WhatsAppWebhookVerifyToken:
    Type: String
    NoEcho: true
    Default: ""
  WhatsAppBusinessAccountId:
    Type: String
    NoEcho: true
    Default: ""
  MetaAppSecret:
    Type: String
    NoEcho: true
    Default: ""

  # Smile Identity (KYC)
  SmilePartnerId:
    Type: String
    NoEcho: true
    Default: ""
  SmileApiKey:
    Type: String
    NoEcho: true
    Default: ""

  # EcoCash
  EcocashMerchantId:
    Type: String
    NoEcho: true
    Default: ""
  EcocashApiKey:
    Type: String
    NoEcho: true
    Default: ""

  # OneMoney
  OnemoneyMerchantId:
    Type: String
    NoEcho: true
    Default: ""
  OnemoneyApiKey:
    Type: String
    NoEcho: true
    Default: ""

  # Trustonic
  TrustonicApiKey:
    Type: String
    NoEcho: true
    Default: ""
  TrustonicApiSecret:
    Type: String
    NoEcho: true
    Default: ""

  # SMS
  SmsApiKey:
    Type: String
    NoEcho: true
    Default: ""

Resources:
  # ==========================================================
  # SECRETS MANAGER ENTRIES
  # ==========================================================

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/lynia/database"
      Description: RDS PostgreSQL connection credentials
      SecretString: !Sub |
        {
          "host": "${DBHost}",
          "port": "${DBPort}",
          "database": "${DBName}",
          "username": "${DBUsername}",
          "password": "${DBPassword}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: shared

  WhatsAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/lynia/whatsapp"
      Description: WhatsApp Cloud API credentials
      SecretString: !Sub |
        {
          "WHATSAPP_PHONE_NUMBER_ID": "${WhatsAppPhoneNumberId}",
          "WHATSAPP_ACCESS_TOKEN": "${WhatsAppAccessToken}",
          "WHATSAPP_WEBHOOK_VERIFY_TOKEN": "${WhatsAppWebhookVerifyToken}",
          "WHATSAPP_BUSINESS_ACCOUNT_ID": "${WhatsAppBusinessAccountId}",
          "META_APP_SECRET": "${MetaAppSecret}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: whatsapp-service

  SmileIdentitySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/lynia/smile-identity"
      Description: Smile Identity KYC verification credentials
      SecretString: !Sub |
        {
          "SMILE_PARTNER_ID": "${SmilePartnerId}",
          "SMILE_API_KEY": "${SmileApiKey}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: kyc-service

  EcocashSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/lynia/ecocash"
      Description: EcoCash mobile money payment credentials
      SecretString: !Sub |
        {
          "ECOCASH_MERCHANT_ID": "${EcocashMerchantId}",
          "ECOCASH_API_KEY": "${EcocashApiKey}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payment-service

  OnemoneySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/lynia/onemoney"
      Description: OneMoney mobile money payment credentials
      SecretString: !Sub |
        {
          "ONEMONEY_MERCHANT_ID": "${OnemoneyMerchantId}",
          "ONEMONEY_API_KEY": "${OnemoneyApiKey}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: payment-service

  TrustonicSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/lynia/trustonic"
      Description: Trustonic device lock/unlock credentials
      SecretString: !Sub |
        {
          "TRUSTONIC_API_KEY": "${TrustonicApiKey}",
          "TRUSTONIC_API_SECRET": "${TrustonicApiSecret}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: lock-service

  SmsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/lynia/sms"
      Description: SMS provider credentials
      SecretString: !Sub |
        {
          "SMS_API_KEY": "${SmsApiKey}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: notification-service

  # ==========================================================
  # IAM POLICIES FOR SECRET ACCESS
  # ==========================================================

  # Shared policy - all functions can read database secret
  SharedSecretsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Environment}-lynia-shared-secrets-read"
      Description: Allows Lambda functions to read shared secrets (database)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref DatabaseSecret

  WhatsAppSecretsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Environment}-lynia-whatsapp-secrets-read"
      Description: Allows WhatsApp service to read its secrets
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref DatabaseSecret
              - !Ref WhatsAppSecret

  KYCSecretsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Environment}-lynia-kyc-secrets-read"
      Description: Allows KYC service to read its secrets
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref DatabaseSecret
              - !Ref SmileIdentitySecret

  PaymentSecretsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Environment}-lynia-payment-secrets-read"
      Description: Allows Payment service to read its secrets
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref DatabaseSecret
              - !Ref EcocashSecret
              - !Ref OnemoneySecret

  LockSecretsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Environment}-lynia-lock-secrets-read"
      Description: Allows Lock service to read its secrets
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref DatabaseSecret
              - !Ref TrustonicSecret

  NotificationSecretsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Environment}-lynia-notification-secrets-read"
      Description: Allows Notification service to read its secrets
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref DatabaseSecret
              - !Ref SmsSecret

Outputs:
  DatabaseSecretArn:
    Description: Database secret ARN
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub "${Environment}-lynia-database-secret-arn"

  WhatsAppSecretArn:
    Description: WhatsApp secret ARN
    Value: !Ref WhatsAppSecret
    Export:
      Name: !Sub "${Environment}-lynia-whatsapp-secret-arn"

  SmileIdentitySecretArn:
    Description: Smile Identity secret ARN
    Value: !Ref SmileIdentitySecret
    Export:
      Name: !Sub "${Environment}-lynia-smile-identity-secret-arn"

  EcocashSecretArn:
    Description: EcoCash secret ARN
    Value: !Ref EcocashSecret
    Export:
      Name: !Sub "${Environment}-lynia-ecocash-secret-arn"

  OnemoneySecretArn:
    Description: OneMoney secret ARN
    Value: !Ref OnemoneySecret
    Export:
      Name: !Sub "${Environment}-lynia-onemoney-secret-arn"

  TrustonicSecretArn:
    Description: Trustonic secret ARN
    Value: !Ref TrustonicSecret
    Export:
      Name: !Sub "${Environment}-lynia-trustonic-secret-arn"

  SmsSecretArn:
    Description: SMS secret ARN
    Value: !Ref SmsSecret
    Export:
      Name: !Sub "${Environment}-lynia-sms-secret-arn"

  SharedSecretsPolicyArn:
    Description: Shared secrets IAM policy ARN
    Value: !Ref SharedSecretsPolicy
    Export:
      Name: !Sub "${Environment}-lynia-shared-secrets-policy-arn"

  WhatsAppSecretsPolicyArn:
    Description: WhatsApp secrets IAM policy ARN
    Value: !Ref WhatsAppSecretsPolicy
    Export:
      Name: !Sub "${Environment}-lynia-whatsapp-secrets-policy-arn"

  KYCSecretsPolicyArn:
    Description: KYC secrets IAM policy ARN
    Value: !Ref KYCSecretsPolicy
    Export:
      Name: !Sub "${Environment}-lynia-kyc-secrets-policy-arn"

  PaymentSecretsPolicyArn:
    Description: Payment secrets IAM policy ARN
    Value: !Ref PaymentSecretsPolicy
    Export:
      Name: !Sub "${Environment}-lynia-payment-secrets-policy-arn"

  LockSecretsPolicyArn:
    Description: Lock secrets IAM policy ARN
    Value: !Ref LockSecretsPolicy
    Export:
      Name: !Sub "${Environment}-lynia-lock-secrets-policy-arn"

  NotificationSecretsPolicyArn:
    Description: Notification secrets IAM policy ARN
    Value: !Ref NotificationSecretsPolicy
    Export:
      Name: !Sub "${Environment}-lynia-notification-secrets-policy-arn"
