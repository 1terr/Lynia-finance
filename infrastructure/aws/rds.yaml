AWSTemplateFormatVersion: '2010-09-09'
Description: Lynia Finance - RDS PostgreSQL Database

Parameters:
  Environment:
    Type: String
    AllowedValues: [development, staging, production]
  DBMasterUsername:
    Type: String
    Default: lynia_admin
    NoEcho: true
  DBMasterPassword:
    Type: String
    NoEcho: true

Conditions:
  IsProduction: !Equals [!Ref Environment, production]

Resources:
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Lynia Finance DB subnets
      SubnetIds:
        - !ImportValue
          Fn::Sub: "${Environment}-lynia-private-subnet-1"
        - !ImportValue
          Fn::Sub: "${Environment}-lynia-private-subnet-2"

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS access from Lambda functions
      VpcId: !ImportValue
        Fn::Sub: "${Environment}-lynia-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: "${Environment}-lynia-lambda-sg-id"

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${Environment}-lynia-db"
      Engine: postgres
      EngineVersion: "16.11"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      MaxAllocatedStorage: 20
      StorageType: gp2
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBMasterPassword
      DBName: lynia
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      MultiAZ: false
      BackupRetentionPeriod: 1
      StorageEncrypted: true
      DeletionProtection: false
      EnablePerformanceInsights: false
      PubliclyAccessible: false
      CopyTagsToSnapshot: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: lynia-finance

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt DatabaseInstance.Endpoint.Address
    Export:
      Name: !Sub "${Environment}-lynia-db-endpoint"
  DatabasePort:
    Value: !GetAtt DatabaseInstance.Endpoint.Port
    Export:
      Name: !Sub "${Environment}-lynia-db-port"
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub "${Environment}-lynia-db-sg"
