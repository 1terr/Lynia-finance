AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lynia Finance - Lambda Auto-Scaling and Concurrency Configuration
  Reserved concurrency, provisioned concurrency, and Application Auto Scaling
  for production Lambda functions

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - development
      - staging
      - production

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  IsStaging: !Equals [!Ref Environment, staging]
  UseProvisionedConcurrency: !Or
    - !Condition IsProduction
    - !Condition IsStaging

Resources:
  # ==========================================================
  # RESERVED CONCURRENCY (hard limits per function)
  # Prevents any single function from consuming all account
  # concurrency and starving other functions.
  #
  # Account default: 1000 concurrent executions
  # Total reserved below: 350 (production) / 100 (non-prod)
  # Unreserved pool: 650 (production) / 900 (non-prod)
  # ==========================================================

  # Payment Service - highest priority, most reserved
  PaymentReservedConcurrency:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Environment}-lynia-payment-concurrency-config"
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt ConcurrencyConfigRole.Arn
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200, body: 'concurrency-config-placeholder' });
      Description: "Placeholder - actual concurrency is set on the payment-service function"
    Metadata:
      ConcurrencyNote: >
        This is a documentation resource. Actual ReservedConcurrentExecutions
        is set on the main payment-service Lambda in template.yaml.
        Production: 100, Staging: 30, Dev: unreserved

  # ==========================================================
  # PROVISIONED CONCURRENCY (eliminates cold starts)
  # Only for production critical-path functions
  # ==========================================================

  # Payment Service - zero cold starts for financial transactions
  PaymentProvisionedConcurrency:
    Type: AWS::Lambda::ProvisionedConcurrencyConfig
    Condition: UseProvisionedConcurrency
    Properties:
      FunctionName: !Sub "${Environment}-lynia-payment-service"
      Qualifier: live
      ProvisionedConcurrentExecutions: !If [IsProduction, 5, 2]

  # Scoring Service - low-latency credit decisions
  ScoringProvisionedConcurrency:
    Type: AWS::Lambda::ProvisionedConcurrencyConfig
    Condition: UseProvisionedConcurrency
    Properties:
      FunctionName: !Sub "${Environment}-lynia-scoring-service"
      Qualifier: live
      ProvisionedConcurrentExecutions: !If [IsProduction, 3, 1]

  # WhatsApp Service - responsive customer messaging
  WhatsAppProvisionedConcurrency:
    Type: AWS::Lambda::ProvisionedConcurrencyConfig
    Condition: UseProvisionedConcurrency
    Properties:
      FunctionName: !Sub "${Environment}-lynia-whatsapp-service"
      Qualifier: live
      ProvisionedConcurrentExecutions: !If [IsProduction, 3, 1]

  # ==========================================================
  # APPLICATION AUTO SCALING (dynamic scaling of provisioned concurrency)
  # Scales provisioned concurrency based on utilization
  # ==========================================================

  # Auto Scaling Target - Payment Service
  PaymentScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: IsProduction
    DependsOn: PaymentProvisionedConcurrency
    Properties:
      MaxCapacity: 50
      MinCapacity: 5
      ResourceId: !Sub "function:${Environment}-lynia-payment-service:live"
      RoleARN: !GetAtt AutoScalingRole.Arn
      ScalableDimension: lambda:function:ProvisionedConcurrency
      ServiceNamespace: lambda

  PaymentScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: IsProduction
    Properties:
      PolicyName: !Sub "${Environment}-lynia-payment-scaling"
      PolicyType: TargetTrackingScaling
      ScalableTargetId: !Ref PaymentScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 0.7
        PredefinedMetricSpecification:
          PredefinedMetricType: LambdaProvisionedConcurrencyUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # Auto Scaling Target - Scoring Service
  ScoringScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: IsProduction
    DependsOn: ScoringProvisionedConcurrency
    Properties:
      MaxCapacity: 30
      MinCapacity: 3
      ResourceId: !Sub "function:${Environment}-lynia-scoring-service:live"
      RoleARN: !GetAtt AutoScalingRole.Arn
      ScalableDimension: lambda:function:ProvisionedConcurrency
      ServiceNamespace: lambda

  ScoringScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: IsProduction
    Properties:
      PolicyName: !Sub "${Environment}-lynia-scoring-scaling"
      PolicyType: TargetTrackingScaling
      ScalableTargetId: !Ref ScoringScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 0.7
        PredefinedMetricSpecification:
          PredefinedMetricType: LambdaProvisionedConcurrencyUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # Auto Scaling Target - WhatsApp Service
  WhatsAppScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: IsProduction
    DependsOn: WhatsAppProvisionedConcurrency
    Properties:
      MaxCapacity: 30
      MinCapacity: 3
      ResourceId: !Sub "function:${Environment}-lynia-whatsapp-service:live"
      RoleARN: !GetAtt AutoScalingRole.Arn
      ScalableDimension: lambda:function:ProvisionedConcurrency
      ServiceNamespace: lambda

  WhatsAppScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: IsProduction
    Properties:
      PolicyName: !Sub "${Environment}-lynia-whatsapp-scaling"
      PolicyType: TargetTrackingScaling
      ScalableTargetId: !Ref WhatsAppScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 0.7
        PredefinedMetricSpecification:
          PredefinedMetricType: LambdaProvisionedConcurrencyUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ==========================================================
  # SCHEDULED SCALING (pre-warm for known traffic patterns)
  # Zimbabwe business hours: 06:00 - 20:00 CAT (UTC+2)
  # ==========================================================

  PaymentScheduledScaleUp:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: IsProduction
    DependsOn: PaymentProvisionedConcurrency
    Properties:
      MaxCapacity: 50
      MinCapacity: 10
      ResourceId: !Sub "function:${Environment}-lynia-payment-service:live"
      RoleARN: !GetAtt AutoScalingRole.Arn
      ScalableDimension: lambda:function:ProvisionedConcurrency
      ServiceNamespace: lambda
      ScheduledActions:
        # Scale up at 06:00 CAT (04:00 UTC)
        - ScheduledActionName: BusinessHoursStart
          Schedule: "cron(0 4 ? * MON-FRI *)"
          ScalableTargetAction:
            MinCapacity: 10
        # Scale down at 20:00 CAT (18:00 UTC)
        - ScheduledActionName: BusinessHoursEnd
          Schedule: "cron(0 18 ? * MON-FRI *)"
          ScalableTargetAction:
            MinCapacity: 5
        # Weekend lower baseline
        - ScheduledActionName: WeekendStart
          Schedule: "cron(0 18 ? * FRI *)"
          ScalableTargetAction:
            MinCapacity: 3

  # ==========================================================
  # IAM ROLES FOR AUTO SCALING
  # ==========================================================

  AutoScalingRole:
    Type: AWS::IAM::Role
    Condition: IsProduction
    Properties:
      RoleName: !Sub "${Environment}-lynia-autoscaling-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaAutoScaling
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:PutProvisionedConcurrencyConfig
                  - lambda:GetProvisionedConcurrencyConfig
                  - lambda:DeleteProvisionedConcurrencyConfig
                  - lambda:GetAlias
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-lynia-*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DeleteAlarms
                Resource: "*"

  ConcurrencyConfigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-lynia-concurrency-config-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ==========================================================
  # CONCURRENCY ALARMS
  # ==========================================================

  PaymentConcurrencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub "${Environment}-lynia-payment-high-concurrency"
      AlarmDescription: "Payment service provisioned concurrency utilization > 85%"
      Namespace: AWS/Lambda
      MetricName: ProvisionedConcurrencyUtilization
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${Environment}-lynia-payment-service"
        - Name: Resource
          Value: !Sub "${Environment}-lynia-payment-service:live"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0.85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SpilloverAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub "${Environment}-lynia-concurrency-spillover"
      AlarmDescription: "Provisioned concurrency spillover detected - cold starts occurring"
      Namespace: AWS/Lambda
      MetricName: ProvisionedConcurrencySpilloverInvocations
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  PaymentProvisionedConcurrency:
    Description: Payment service provisioned concurrency
    Condition: UseProvisionedConcurrency
    Value: !If [IsProduction, "5 (auto-scales 5-50)", "2 (fixed)"]

  ScoringProvisionedConcurrency:
    Description: Scoring service provisioned concurrency
    Condition: UseProvisionedConcurrency
    Value: !If [IsProduction, "3 (auto-scales 3-30)", "1 (fixed)"]

  WhatsAppProvisionedConcurrency:
    Description: WhatsApp service provisioned concurrency
    Condition: UseProvisionedConcurrency
    Value: !If [IsProduction, "3 (auto-scales 3-30)", "1 (fixed)"]

  AutoScalingStrategy:
    Description: Auto-scaling strategy summary
    Value: !If
      - IsProduction
      - "Target tracking at 70% utilization with scheduled scaling for ZW business hours"
      - "Fixed provisioned concurrency, no auto-scaling"
