AWSTemplateFormatVersion: '2010-09-09'
Description: !Sub "Lynia Finance - Cognito User Pool (deploy: ${DeployId})"

Parameters:
  Environment:
    Type: String
    AllowedValues: [development, staging, production]
  DeployId:
    Type: String
    Description: Unique deployment identifier to force changeset creation
    Default: local

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${Environment}-lynia-users"
      UserPoolTier: LITE
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: role
          AttributeDataType: String
          Mutable: true
        - Name: display_name
          AttributeDataType: String
          Mutable: true
        - Name: organization_id
          AttributeDataType: String
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # App client for admin portal
  AdminPortalClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${Environment}-admin-portal"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # App client for distributor dashboard
  DistributorClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${Environment}-distributor-dashboard"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # User groups matching frontend AdminRole definitions
  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super_admin
      UserPoolId: !Ref UserPool
      Description: Super administrators with full system access including settings write
      Precedence: 0

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Full system administrators
      Precedence: 1

  OperationsManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: operations_manager
      UserPoolId: !Ref UserPool
      Description: Operations managers with broad access
      Precedence: 2

  CustomerSupportGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: customer_support
      UserPoolId: !Ref UserPool
      Description: Customer support staff with read access
      Precedence: 3

  FinanceTeamGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: finance_team
      UserPoolId: !Ref UserPool
      Description: Finance team with payment and reporting access
      Precedence: 4

  KycReviewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: kyc_reviewer
      UserPoolId: !Ref UserPool
      Description: KYC document reviewers
      Precedence: 5

  InventoryManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: inventory_manager
      UserPoolId: !Ref UserPool
      Description: Device inventory managers
      Precedence: 6

  ReportsViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: reports_viewer
      UserPoolId: !Ref UserPool
      Description: Read-only reports access
      Precedence: 7

  DistributorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: distributor
      UserPoolId: !Ref UserPool
      Description: Field agents and distributors
      Precedence: 8

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "${Environment}-lynia-user-pool-id"
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${Environment}-lynia-user-pool-arn"
  AdminClientId:
    Value: !Ref AdminPortalClient
    Export:
      Name: !Sub "${Environment}-lynia-admin-client-id"
  DistributorClientId:
    Value: !Ref DistributorClient
    Export:
      Name: !Sub "${Environment}-lynia-distributor-client-id"
