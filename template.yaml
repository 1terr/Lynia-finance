  # =====================================================
  # 8. FINERACT RECONCILIATION SERVICE
  # =====================================================
  FineractReconciliationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-fineract-reconciliation
      CodeUri: services/
      Handler: shared/clients/fineract-reconcile.reconciliationHandler
      Description: Fineract reconciliation - compares loan balances and retries failed syncs every 6 hours
      MemorySize: 512
      Timeout: 300
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/fineract-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        ScheduledReconciliation:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Run Fineract reconciliation every hour
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
