                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/fineract-*"
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminUpdateUserAttributes
              Resource:
                - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-fineract-sync-retry"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !If
            - HasCognitoPoolId
            - !Ref CognitoUserPoolId
            - ""
          SES_SENDER_EMAIL: !Ref SesSenderEmail
      Events:
        # Health check (unauthenticated)
        AdminHealth:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /admin/health
            Method: GET
            Auth:
              Authorizer: NONE
        # Catch-all proxy routes to avoid Lambda policy size limit (20KB)
        # The handler does its own path-based routing internally
        AdminMeAny:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /admin/me
            Method: ANY
        AdminProxy:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /admin/{proxy+}
            Method: ANY
        DashboardProxy:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/dashboard/{proxy+}
            Method: ANY
        KYCAdminProxy:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/kyc/submissions/{proxy+}
            Method: ANY
        PaymentsAdminRoot:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/payments
            Method: ANY
        PaymentsAdminProxy:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/payments/{proxy+}
            Method: ANY
        ReportsRoot:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/reports
            Method: ANY
        ReportsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/reports/{proxy+}
            Method: ANY
        CustomersRoot:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/customers
            Method: ANY
        CustomersProxy:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/customers/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
