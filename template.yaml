            Path: /api/v1/distributor/transfers/{id}
            Method: GET
        GetTransferByIdOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/distributor/transfers/{id}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        MarkNotificationRead:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/distributor/notifications/{id}/read
            Method: PATCH
        MarkNotificationReadOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/distributor/notifications/{id}/read
            Method: OPTIONS
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - distributor-service/src/index.ts

  # =====================================================
  # 12. INVESTOR REPORTING SERVICE
  # =====================================================
  InvestorReportingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-investor-reporting
      CodeUri: services/
      Handler: investor-reporting-service/src/index.handler
      Description: Investor-grade portfolio analytics, loan tape export, borrowing base, and covenant compliance
      MemorySize: 512
      Timeout: 60
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        InvestorHealth:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/health
            Method: GET
            Auth:
              Authorizer: NONE
        # Portfolio Summary
        GetPortfolio:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/portfolio
            Method: GET
        GetPortfolioOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/portfolio
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        # Vintage Analysis
        GetVintages:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/vintages
            Method: GET
        GetVintagesOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/vintages
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        # Loan Tape Export
        GetLoanTape:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/loan-tape
            Method: GET
        GetLoanTapeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/loan-tape
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        # Borrowing Base
        GetBorrowingBase:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/borrowing-base
            Method: GET
        GetBorrowingBaseOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/borrowing-base
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        # Collections
        GetCollections:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/collections
            Method: GET
        GetCollectionsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/collections
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        # Financials
        GetFinancials:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/financials
            Method: GET
        GetFinancialsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/financials
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        # Covenant Compliance
        GetCovenantCompliance:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/covenant-compliance
            Method: GET
        GetCovenantComplianceOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/covenant-compliance
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        # Fee Revenue
        GetFeeRevenue:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/fee-revenue
            Method: GET
        GetFeeRevenueOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/fee-revenue
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        # Data Freshness
        GetDataFreshness:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/data-freshness
            Method: GET
        GetDataFreshnessOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /api/v1/investor/data-freshness
            Method: OPTIONS
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - investor-reporting-service/src/index.ts

  # =====================================================
  # 12. DW SYNC SERVICE (Real-Time Data Warehouse)
  # =====================================================
  DWSyncFunction:
    Type: AWS::Serverless::Function
    Condition: IsProduction
    Properties:
      FunctionName: !Sub ${Environment}-lynia-dw-sync
      CodeUri: services/
      Handler: dw-sync-service/src/index.handler
      Description: Real-time data warehouse sync - processes business events and updates DW tables
      MemorySize: 512
      Timeout: 120
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-dw-sync"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        DWSyncQueue:
          Type: SQS
          Properties:
            Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-dw-sync"
            BatchSize: 5
            MaximumBatchingWindowInSeconds: 10
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - dw-sync-service/src/index.ts

  # =====================================================
  # 13. AUTO-DEFAULT SCHEDULER (Daily Loan Default Check)
  # =====================================================
  AutoDefaultSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-auto-default-scheduler
      CodeUri: services/
      Handler: payment-service/src/handlers/auto-default-handler.handler
      Description: Auto-default loans at 90+ days past due - runs daily at 7am CAT
      MemorySize: 512
      Timeout: 120
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/fineract-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        DailyAutoDefault:
          Type: Schedule
          Properties:
            Schedule: cron(0 5 * * ? *)
            Description: Auto-default loans daily at 5am UTC (7am CAT)
            Enabled: !If [IsProduction, true, false]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - payment-service/src/handlers/auto-default-handler.ts

  # =====================================================
  # 14. ORG DATA FRESHNESS CHECKER (Monthly Schedule)
  # =====================================================
  OrgDataFreshnessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-org-data-freshness
      CodeUri: services/
      Handler: admin-service/src/handlers/org-data-freshness.handler
      Description: Monthly check for organizations with stale member data (30+ days since last import)
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          ALERT_SNS_TOPIC_ARN: !If
            - HasAlertSnsTopic
            - !Ref AlertSnsTopicArn
            - ""
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
            - Effect: Allow
              Action:
                - sns:Publish
              Resource:
                - !If
                  - HasAlertSnsTopic
                  - !Ref AlertSnsTopicArn
                  - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        MonthlyFreshnessCheck:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 1 * ? *)
            Description: Check org data freshness monthly on 1st at 6am UTC (8am CAT)
            Enabled: !If [IsProduction, true, false]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - admin-service/src/handlers/org-data-freshness.ts

  # =====================================================
  # 15. RESERVATION EXPIRY SCHEDULER (Hourly)
  # =====================================================
  ReservationExpiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-reservation-expiry
      CodeUri: services/
      Handler: admin-service/src/handlers/reservation-expiry.handler
      Description: Hourly check for expired device reservations - releases devices back to in_stock
      MemorySize: 256
      Timeout: 60
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        HourlyReservationExpiry:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Expire stale device reservations every hour
            Enabled: !If [IsProduction, true, false]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - admin-service/src/handlers/reservation-expiry.ts

  # =====================================================
  # FINERACT CLOUDWATCH DASHBOARD
  # =====================================================
  FineractDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: IsProduction
    Properties:
      DashboardName: !Sub ${Environment}-lynia-fineract-proxy
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": { "markdown": "# Fineract Integration Health - ${Environment}" }
            },
            {
              "type": "metric",
              "x": 0, "y": 1, "width": 8, "height": 6,
              "properties": {
                "title": "Proxy Service - Invocations & Errors",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${Environment}-lynia-fineract-proxy", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${Environment}-lynia-fineract-proxy", {"stat": "Sum", "color": "#d62728"}]
                ],
                "period": 300, "region": "${AWS::Region}", "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 1, "width": 8, "height": 6,
              "properties": {
                "title": "Proxy Service - Latency (ms)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${Environment}-lynia-fineract-proxy", {"stat": "p50", "label": "p50"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${Environment}-lynia-fineract-proxy", {"stat": "p95", "label": "p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${Environment}-lynia-fineract-proxy", {"stat": "p99", "label": "p99", "color": "#d62728"}]
                ],
                "period": 300, "region": "${AWS::Region}", "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 1, "width": 8, "height": 6,
              "properties": {
                "title": "Reconciliation Service - Invocations & Errors",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${Environment}-lynia-fineract-reconciliation", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${Environment}-lynia-fineract-reconciliation", {"stat": "Sum", "color": "#d62728"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${Environment}-lynia-fineract-reconciliation", {"stat": "Average", "color": "#ff7f0e"}]
                ],
                "period": 300, "region": "${AWS::Region}", "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 7, "width": 12, "height": 6,
              "properties": {
                "title": "Fineract Sync - Success / Failure",
                "metrics": [
                  ["Lynia/${Environment}", "FineractSyncSuccess", {"stat": "Sum", "color": "#2ca02c"}],
                  ["Lynia/${Environment}", "FineractSyncFailure", {"stat": "Sum", "color": "#d62728"}],
                  ["Lynia/${Environment}", "FineractReconciliationDiscrepancies", {"stat": "Sum", "color": "#ff7f0e"}]
                ],
                "period": 300, "region": "${AWS::Region}", "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 7, "width": 12, "height": 6,
              "properties": {
                "title": "Fineract API Latency (via Proxy)",
                "metrics": [
                  ["Lynia/${Environment}", "FineractApiLatency", {"stat": "p50", "label": "p50"}],
                  ["Lynia/${Environment}", "FineractApiLatency", {"stat": "p95", "label": "p95"}],
                  ["Lynia/${Environment}", "FineractApiLatency", {"stat": "p99", "label": "p99", "color": "#d62728"}]
                ],
                "period": 300, "region": "${AWS::Region}", "view": "timeSeries"
              }
            }
          ]
        }

  # =====================================================
  # CLOUDWATCH ALARM: Fineract Sync Failures
  # =====================================================
  FineractSyncFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertSnsTopic
    Properties:
      AlarmName: !Sub ${Environment}-lynia-fineract-sync-failures
      AlarmDescription: Fires when Fineract approval sync failures are detected during reconciliation
      Namespace: !Sub Lynia/${Environment}
      MetricName: FineractApprovalSyncFailures
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertSnsTopicArn
      OKActions:
        - !Ref AlertSnsTopicArn

Outputs:
  # API Gateway
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${LyniaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
    Export:
      Name: !Sub ${Environment}-lynia-api-url

  ApiGatewayId:
    Description: API Gateway REST API ID
    Value: !Ref LyniaApi
    Export:
      Name: !Sub ${Environment}-lynia-api-id

  # Function ARNs
  ScoringFunctionArn:
    Description: Scoring Service Lambda Function ARN
    Value: !GetAtt ScoringFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-scoring-arn

  WhatsAppFunctionArn:
    Description: WhatsApp Service Lambda Function ARN
    Value: !GetAtt WhatsAppFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-whatsapp-arn

  KYCFunctionArn:
    Description: KYC Service Lambda Function ARN
    Value: !GetAtt KYCFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-kyc-arn

  PaymentFunctionArn:
    Description: Payment Service Lambda Function ARN
    Value: !GetAtt PaymentFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-payment-arn

  LockFunctionArn:
    Description: Lock Service Lambda Function ARN
    Value: !GetAtt LockFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-lock-arn

  NotificationFunctionArn:
    Description: Notification Service Lambda Function ARN
    Value: !GetAtt NotificationFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-notification-arn

  FormSubmissionFunctionArn:
    Description: Form Submission Service Lambda Function ARN
    Value: !GetAtt FormSubmissionFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-form-submission-arn

  FineractReconciliationFunctionArn:
    Description: Fineract Reconciliation Lambda Function ARN
    Value: !GetAtt FineractReconciliationFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-fineract-reconciliation-arn

  FineractProxyFunctionArn:
    Description: Fineract Proxy Service Lambda Function ARN
    Value: !GetAtt FineractProxyFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-fineract-proxy-arn

  AutoDefaultSchedulerFunctionArn:
    Description: Auto-Default Scheduler Lambda Function ARN
    Value: !GetAtt AutoDefaultSchedulerFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-auto-default-scheduler-arn

  ReservationExpiryFunctionArn:
    Description: Reservation Expiry Scheduler Lambda Function ARN
    Value: !GetAtt ReservationExpiryFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-reservation-expiry-arn

