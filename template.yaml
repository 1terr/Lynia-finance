  # =====================================================
  # 6. NOTIFICATION SERVICE
  # =====================================================
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-notification-service
      CodeUri: services/
      Handler: notification-service/src/index.handler
      Description: Multi-channel notification service (SMS, WhatsApp, Email)
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/sms-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-notification*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"  # SNS Publish to phone numbers requires wildcard
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Environment:
        Variables:
          SES_SENDER_EMAIL: !Ref SesSenderEmail
          SMS_PROVIDER: !Ref SmsProvider  # Legacy — SMS now uses AWS SNS (IAM auth)
          SMS_API_KEY: !Ref SmsApiKey     # Legacy — kept for backward compatibility
          WHATSAPP_API_URL: !Ref WhatsAppApiUrl
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      Events:
        NotificationHealth:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /notifications/health
            Method: GET
            Auth:
              Authorizer: NONE
        SendNotification:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /notifications/send
            Method: POST
        GetNotificationHistory:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /notifications/{customerId}
            Method: GET
        # NotificationQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-notifications"
        #     BatchSize: 10
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - notification-service/src/index.ts

