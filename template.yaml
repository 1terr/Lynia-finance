AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lynia Finance - Serverless Microservices
  6 Lambda functions for Phase 2: Scoring, WhatsApp, KYC, Payment, Lock, Notification

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # VPC parameters (SecurityGroupId, SubnetIds) are typed as String with
        # empty defaults because VPC is optional (controlled by the UseVPC
        # condition).  cfn-lint cannot resolve the !If condition at lint time
        # so it incorrectly flags every Ref to these parameters as not matching
        # the sg-*/subnet-* patterns.
        - W1030

# Global configuration for all functions
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Tracing: Active
    EphemeralStorage:
      Size: 512
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        DB_SECRET_NAME: !Sub "${Environment}/lynia/database"
        FINERACT_SECRET_NAME: !Sub "${Environment}/lynia/fineract-api"
        LOG_LEVEL: info
        SECRETS_PREFIX: !Sub "${Environment}/lynia"
        API_STACK_NAME: !Sub "${AWS::StackName}"
    VpcConfig: !If
      - UseVPC
      - SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      - !Ref "AWS::NoValue"

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Deployment environment

  CognitoUserPoolArn:
    Type: String
    Description: Cognito User Pool ARN for API Gateway authorizer
    Default: ""

  WhatsAppPhoneNumberId:
    Type: String
    Description: WhatsApp Cloud API Phone Number ID
    NoEcho: true
    Default: ""

  WhatsAppAccessToken:
    Type: String
    Description: WhatsApp Cloud API Access Token
    NoEcho: true
    Default: ""

  WhatsAppWebhookVerifyToken:
    Type: String
    Description: WhatsApp Webhook Verification Token
    NoEcho: true
    Default: ""

  WhatsAppBusinessAccountId:
    Type: String
    Description: WhatsApp Business Account ID
    NoEcho: true
    Default: ""

  MetaAppSecret:
    Type: String
    Description: Meta App Secret for webhook HMAC signature validation
    NoEcho: true
    Default: ""

  SmilePartnerId:
    Type: String
    Description: Smile Identity Partner ID
    NoEcho: true
    Default: ""

  SmileApiKey:
    Type: String
    Description: Smile Identity API Key
    NoEcho: true
    Default: ""

  SmileEnvironment:
    Type: String
    Description: Smile Identity Environment (sandbox/production)
    Default: sandbox
    AllowedValues:
      - sandbox
      - production

  EcocashMerchantId:
    Type: String
    Description: EcoCash Merchant ID
    NoEcho: true
    Default: ""

  EcocashApiKey:
    Type: String
    Description: EcoCash API Key
    NoEcho: true
    Default: ""

  OnemoneyMerchantId:
    Type: String
    Description: OneMoney Merchant ID
    NoEcho: true
    Default: ""

  OnemoneyApiKey:
    Type: String
    Description: OneMoney API Key
    NoEcho: true
    Default: ""

  TrustonicApiKey:
    Type: String
    Description: Trustonic API Key
    NoEcho: true
    Default: ""

  TrustonicApiSecret:
    Type: String
    Description: Trustonic API Secret
    NoEcho: true
    Default: ""

  SmsProvider:
    Type: String
    Description: SMS Provider (twilio/africas_talking)
    Default: twilio
    AllowedValues:
      - twilio
      - africas_talking

  SmsApiKey:
    Type: String
    Description: SMS Provider API Key
    NoEcho: true
    Default: ""

  # VPC Configuration (from VPC stack outputs)
  VpcEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable VPC configuration for Lambda functions

  PrivateSubnet1Id:
    Type: String
    Default: ""
    Description: Private Subnet 1 ID from VPC stack

  PrivateSubnet2Id:
    Type: String
    Default: ""
    Description: Private Subnet 2 ID from VPC stack

  LambdaSecurityGroupId:
    Type: String
    Default: "sg-00000000"
    AllowedPattern: "^sg-[a-fA-F0-9]{8,17}$"
    Description: Lambda Security Group ID from VPC stack

Conditions:
  UseVPC: !Equals [!Ref VpcEnabled, "true"]
  HasCognitoArn: !Not [!Equals [!Ref CognitoUserPoolArn, ""]]
  IsProduction: !Equals [!Ref Environment, "production"]

Resources:
  # =====================================================
  # API GATEWAY COGNITO AUTHORIZER
  # =====================================================
  LyniaApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${Environment}-lynia-api
      StageName: Prod
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          DataTraceEnabled: false
          LoggingLevel: "OFF"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"

  # =====================================================
  # 1. SCORING SERVICE
  # =====================================================
  ScoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-scoring-service
      CodeUri: services/
      Handler: scoring-service/src/index.handler
      Description: Credit scoring and loan assessment service
      MemorySize: 1024
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/fineract-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          SCORING_MODEL_VERSION: v1
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      # ReservedConcurrentExecutions: !If [IsProduction, 50, !Ref "AWS::NoValue"]  # Disabled - account concurrency limit too low
      Events:
        CalculateScore:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /scoring/calculate
            Method: POST
        GetScore:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /scoring/{customerId}
            Method: GET
        # CreditScoringQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-credit-scoring"
        #     BatchSize: 5
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - scoring-service/src/index.ts

  # =====================================================
  # 2. WHATSAPP SERVICE
  # =====================================================
  WhatsAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-whatsapp-service
      CodeUri: services/
      Handler: whatsapp-service/src/index.handler
      Description: WhatsApp messaging and webhook service
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/whatsapp-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
          WHATSAPP_ACCESS_TOKEN: !Ref WhatsAppAccessToken
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: !Ref WhatsAppWebhookVerifyToken
          WHATSAPP_BUSINESS_ACCOUNT_ID: !Ref WhatsAppBusinessAccountId
          META_APP_SECRET: !Ref MetaAppSecret
          SCORING_API_URL: !Sub "https://${LyniaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/scoring/calculate"
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      Events:
        SendMessage:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /whatsapp/send
            Method: POST
        Webhook:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /whatsapp/webhook
            Method: POST
            Auth:
              Authorizer: NONE
        WebhookVerify:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /whatsapp/webhook
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - whatsapp-service/src/index.ts

  # =====================================================
  # 3. KYC SERVICE
  # =====================================================
  KYCFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-kyc-service
      CodeUri: services/
      Handler: kyc-service/src/index.handler
      Description: KYC verification service (Smile Identity integration)
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/smile-identity-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-kyc-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          SMILE_PARTNER_ID: !Ref SmilePartnerId
          SMILE_API_KEY: !Ref SmileApiKey
          SMILE_ENVIRONMENT: !Ref SmileEnvironment
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      Events:
        InitiateKYC:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /kyc/initiate
            Method: POST
        KYCCallback:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /kyc/callback
            Method: POST
            Auth:
              Authorizer: NONE
        GetKYCStatus:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /kyc/{customerId}
            Method: GET
        # KYCProcessingQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-kyc-processing"
        #     BatchSize: 5
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - kyc-service/src/index.ts

  # =====================================================
  # 4. PAYMENT SERVICE
  # =====================================================
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-payment-service
      CodeUri: services/
      Handler: payment-service/src/index.handler
      Description: Payment processing service (EcoCash, OneMoney integration)
      MemorySize: 1024
      Timeout: 60
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      # ReservedConcurrentExecutions: !If [IsProduction, 100, !Ref "AWS::NoValue"]  # Disabled - account concurrency limit too low
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/fineract-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/ecocash-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/onemoney-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-payment-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          ECOCASH_MERCHANT_ID: !Ref EcocashMerchantId
          ECOCASH_API_KEY: !Ref EcocashApiKey
          ONEMONEY_MERCHANT_ID: !Ref OnemoneyMerchantId
          ONEMONEY_API_KEY: !Ref OnemoneyApiKey
      Events:
        ProcessPayment:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/process
            Method: POST
        PaymentWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/webhook
            Method: POST
            Auth:
              Authorizer: NONE
        GetPaymentStatus:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/{paymentId}
            Method: GET
        # PaymentCallbackQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-payment-callbacks"
        #     BatchSize: 5
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - payment-service/src/index.ts

  # =====================================================
  # 5. LOCK SERVICE
  # =====================================================
  LockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-lock-service
      CodeUri: services/
      Handler: lock-service/src/index.handler
      Description: Device lock/unlock service (Trustonic integration)
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/trustonic-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-device-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          TRUSTONIC_API_KEY: !Ref TrustonicApiKey
          TRUSTONIC_API_SECRET: !Ref TrustonicApiSecret
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      Events:
        LockDevice:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /locks/lock
            Method: POST
        UnlockDevice:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /locks/unlock
            Method: POST
        GetLockStatus:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /locks/{deviceId}
            Method: GET
        ProcessScheduledLocks:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /locks/process-scheduled
            Method: POST
        # DeviceLockQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-device-locks"
        #     BatchSize: 5
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - lock-service/src/index.ts

  # =====================================================
  # 6. NOTIFICATION SERVICE
  # =====================================================
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-notification-service
      CodeUri: services/
      Handler: notification-service/src/index.handler
      Description: Multi-channel notification service (SMS, WhatsApp, Email)
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/sms-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-notification*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          SMS_PROVIDER: !Ref SmsProvider
          SMS_API_KEY: !Ref SmsApiKey
          WHATSAPP_API_URL: !Sub "https://${LyniaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/whatsapp/send"
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      Events:
        SendNotification:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /notifications/send
            Method: POST
        GetNotificationHistory:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /notifications/{customerId}
            Method: GET
        # NotificationQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-notifications"
        #     BatchSize: 10
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - notification-service/src/index.ts

  # =====================================================
  # 7. FORM SUBMISSION SERVICE (Landing Page)
  # =====================================================
  FormSubmissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-form-submission
      CodeUri: services/
      Handler: form-submission-service/src/index.handler
      Description: Landing page form submissions (contact, partnership, waitlist)
      MemorySize: 256
      Timeout: 15
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/database-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      Events:
        SubmitForm:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /forms/submit
            Method: POST
            Auth:
              Authorizer: NONE
        SubmitFormOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /forms/submit
            Method: OPTIONS
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - form-submission-service/src/index.ts

  # =====================================================
  # 8. FINERACT RECONCILIATION SERVICE
  # =====================================================
  FineractReconciliationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-fineract-reconciliation
      CodeUri: services/
      Handler: shared/clients/fineract-reconcile.reconciliationHandler
      Description: Fineract reconciliation - compares loan balances and retries failed syncs every 6 hours
      MemorySize: 512
      Timeout: 300
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/fineract-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        ScheduledReconciliation:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Description: Run Fineract reconciliation every 6 hours
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - shared/clients/fineract-reconcile.ts

Outputs:
  # API Gateway
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${LyniaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
    Export:
      Name: !Sub ${Environment}-lynia-api-url

  ApiGatewayId:
    Description: API Gateway REST API ID
    Value: !Ref LyniaApi
    Export:
      Name: !Sub ${Environment}-lynia-api-id

  # Function ARNs
  ScoringFunctionArn:
    Description: Scoring Service Lambda Function ARN
    Value: !GetAtt ScoringFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-scoring-arn

  WhatsAppFunctionArn:
    Description: WhatsApp Service Lambda Function ARN
    Value: !GetAtt WhatsAppFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-whatsapp-arn

  KYCFunctionArn:
    Description: KYC Service Lambda Function ARN
    Value: !GetAtt KYCFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-kyc-arn

  PaymentFunctionArn:
    Description: Payment Service Lambda Function ARN
    Value: !GetAtt PaymentFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-payment-arn

  LockFunctionArn:
    Description: Lock Service Lambda Function ARN
    Value: !GetAtt LockFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-lock-arn

  NotificationFunctionArn:
    Description: Notification Service Lambda Function ARN
    Value: !GetAtt NotificationFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-notification-arn

  FormSubmissionFunctionArn:
    Description: Form Submission Service Lambda Function ARN
    Value: !GetAtt FormSubmissionFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-form-submission-arn

  FineractReconciliationFunctionArn:
    Description: Fineract Reconciliation Lambda Function ARN
    Value: !GetAtt FineractReconciliationFunction.Arn
    Export:
      Name: !Sub ${Environment}-lynia-fineract-reconciliation-arn
