AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lynia Finance - Serverless Microservices
  6 Lambda functions for Phase 2: Scoring, WhatsApp, KYC, Payment, Lock, Notification

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # VPC parameters (SecurityGroupId, SubnetIds) are typed as String with
        # empty defaults because VPC is optional (controlled by the UseVPC
        # condition).  cfn-lint cannot resolve the !If condition at lint time
        # so it incorrectly flags every Ref to these parameters as not matching
        # the sg-*/subnet-* patterns.
        - W1030

# Global configuration for all functions
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Tracing: Active
    EphemeralStorage:
      Size: 512
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
        LOG_LEVEL: info
        SECRETS_PREFIX: !Sub "${Environment}/lynia"
    VpcConfig: !If
      - UseVPC
      - SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      - !Ref "AWS::NoValue"

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Deployment environment

  SupabaseUrl:
    Type: String
    Description: Supabase project URL
    Default: https://ghdrnxlsupbzoddtyxcp.supabase.co

  SupabaseServiceRoleKey:
    Type: String
    Description: Supabase service role key
    NoEcho: true

  WhatsAppPhoneNumberId:
    Type: String
    Description: WhatsApp Cloud API Phone Number ID
    NoEcho: true
    Default: ""

  WhatsAppAccessToken:
    Type: String
    Description: WhatsApp Cloud API Access Token
    NoEcho: true
    Default: ""

  WhatsAppWebhookVerifyToken:
    Type: String
    Description: WhatsApp Webhook Verification Token
    NoEcho: true
    Default: ""

  SmilePartnerId:
    Type: String
    Description: Smile Identity Partner ID
    NoEcho: true
    Default: ""

  SmileApiKey:
    Type: String
    Description: Smile Identity API Key
    NoEcho: true
    Default: ""

  SmileEnvironment:
    Type: String
    Description: Smile Identity Environment (sandbox/production)
    Default: sandbox
    AllowedValues:
      - sandbox
      - production

  EcocashMerchantId:
    Type: String
    Description: EcoCash Merchant ID
    NoEcho: true
    Default: ""

  EcocashApiKey:
    Type: String
    Description: EcoCash API Key
    NoEcho: true
    Default: ""

  OnemoneyMerchantId:
    Type: String
    Description: OneMoney Merchant ID
    NoEcho: true
    Default: ""

  OnemoneyApiKey:
    Type: String
    Description: OneMoney API Key
    NoEcho: true
    Default: ""

  TrustonicApiKey:
    Type: String
    Description: Trustonic API Key
    NoEcho: true
    Default: ""

  TrustonicApiSecret:
    Type: String
    Description: Trustonic API Secret
    NoEcho: true
    Default: ""

  SmsProvider:
    Type: String
    Description: SMS Provider (twilio/africas_talking)
    Default: twilio
    AllowedValues:
      - twilio
      - africas_talking

  SmsApiKey:
    Type: String
    Description: SMS Provider API Key
    NoEcho: true
    Default: ""

  # VPC Configuration (from VPC stack outputs)
  VpcEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable VPC configuration for Lambda functions

  PrivateSubnet1Id:
    Type: String
    Default: ""
    Description: Private Subnet 1 ID from VPC stack

  PrivateSubnet2Id:
    Type: String
    Default: ""
    Description: Private Subnet 2 ID from VPC stack

  LambdaSecurityGroupId:
    Type: String
    Default: "sg-00000000"
    AllowedPattern: "^sg-[a-fA-F0-9]{8,17}$"
    Description: Lambda Security Group ID from VPC stack

Conditions:
  UseVPC: !Equals [!Ref VpcEnabled, "true"]

Resources:
  # =====================================================
  # 1. SCORING SERVICE
  # =====================================================
  ScoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-scoring-service
      CodeUri: services/scoring-service/
      Handler: dist/index.handler
      Description: Credit scoring and loan assessment service
      MemorySize: 1024
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/supabase-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          SCORING_MODEL_VERSION: v1
      Events:
        CalculateScore:
          Type: Api
          Properties:
            Path: /scoring/calculate
            Method: POST
        GetScore:
          Type: Api
          Properties:
            Path: /scoring/{customerId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/index.ts

  # =====================================================
  # 2. WHATSAPP SERVICE
  # =====================================================
  WhatsAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-whatsapp-service
      CodeUri: services/whatsapp-service/
      Handler: dist/index.handler
      Description: WhatsApp messaging and webhook service
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/supabase-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/whatsapp-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
          WHATSAPP_ACCESS_TOKEN: !Ref WhatsAppAccessToken
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: !Ref WhatsAppWebhookVerifyToken
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /whatsapp/send
            Method: POST
        Webhook:
          Type: Api
          Properties:
            Path: /whatsapp/webhook
            Method: POST
        WebhookVerify:
          Type: Api
          Properties:
            Path: /whatsapp/webhook
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/index.ts

  # =====================================================
  # 3. KYC SERVICE
  # =====================================================
  KYCFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-kyc-service
      CodeUri: services/kyc-service/
      Handler: dist/index.handler
      Description: KYC verification service (Smile Identity integration)
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/supabase-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/smile-identity-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-kyc-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          SMILE_PARTNER_ID: !Ref SmilePartnerId
          SMILE_API_KEY: !Ref SmileApiKey
          SMILE_ENVIRONMENT: !Ref SmileEnvironment
      Events:
        InitiateKYC:
          Type: Api
          Properties:
            Path: /kyc/initiate
            Method: POST
        KYCCallback:
          Type: Api
          Properties:
            Path: /kyc/callback
            Method: POST
        GetKYCStatus:
          Type: Api
          Properties:
            Path: /kyc/{customerId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/index.ts

  # =====================================================
  # 4. PAYMENT SERVICE
  # =====================================================
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-payment-service
      CodeUri: services/payment-service/
      Handler: dist/index.handler
      Description: Payment processing service (EcoCash, OneMoney integration)
      MemorySize: 1024
      Timeout: 60
      AutoPublishAlias: live
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/supabase-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/ecocash-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/onemoney-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-payment-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          ECOCASH_MERCHANT_ID: !Ref EcocashMerchantId
          ECOCASH_API_KEY: !Ref EcocashApiKey
          ONEMONEY_MERCHANT_ID: !Ref OnemoneyMerchantId
          ONEMONEY_API_KEY: !Ref OnemoneyApiKey
      Events:
        ProcessPayment:
          Type: Api
          Properties:
            Path: /payments/process
            Method: POST
        PaymentWebhook:
          Type: Api
          Properties:
            Path: /payments/webhook
            Method: POST
        GetPaymentStatus:
          Type: Api
          Properties:
            Path: /payments/{paymentId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/index.ts

  # =====================================================
  # 5. LOCK SERVICE
  # =====================================================
  LockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-lock-service
      CodeUri: services/lock-service/
      Handler: dist/index.handler
      Description: Device lock/unlock service (Trustonic integration)
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/supabase-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/trustonic-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-device-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          TRUSTONIC_API_KEY: !Ref TrustonicApiKey
          TRUSTONIC_API_SECRET: !Ref TrustonicApiSecret
      Events:
        LockDevice:
          Type: Api
          Properties:
            Path: /locks/lock
            Method: POST
        UnlockDevice:
          Type: Api
          Properties:
            Path: /locks/unlock
            Method: POST
        GetLockStatus:
          Type: Api
          Properties:
            Path: /locks/{deviceId}
            Method: GET
        # Trigger lock processing via API instead of EventBridge schedule
        # (EventBridge requires events:* IAM permissions on the deploy user)
        ProcessScheduledLocks:
          Type: Api
          Properties:
            Path: /locks/process-scheduled
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/index.ts

  # =====================================================
  # 6. NOTIFICATION SERVICE
  # =====================================================
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-notification-service
      CodeUri: services/notification-service/
      Handler: dist/index.handler
      Description: Multi-channel notification service (SMS, WhatsApp, Email)
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/supabase-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/sms-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-notification*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          SMS_PROVIDER: !Ref SmsProvider
          SMS_API_KEY: !Ref SmsApiKey
      Events:
        SendNotification:
          Type: Api
          Properties:
            Path: /notifications/send
            Method: POST
        GetNotificationHistory:
          Type: Api
          Properties:
            Path: /notifications/{customerId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/index.ts

Outputs:
  # API Gateway Endpoint
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/

  # Function ARNs
  ScoringFunctionArn:
    Description: Scoring Service Lambda Function ARN
    Value: !GetAtt ScoringFunction.Arn

  WhatsAppFunctionArn:
    Description: WhatsApp Service Lambda Function ARN
    Value: !GetAtt WhatsAppFunction.Arn

  KYCFunctionArn:
    Description: KYC Service Lambda Function ARN
    Value: !GetAtt KYCFunction.Arn

  PaymentFunctionArn:
    Description: Payment Service Lambda Function ARN
    Value: !GetAtt PaymentFunction.Arn

  LockFunctionArn:
    Description: Lock Service Lambda Function ARN
    Value: !GetAtt LockFunction.Arn

  NotificationFunctionArn:
    Description: Notification Service Lambda Function ARN
    Value: !GetAtt NotificationFunction.Arn
