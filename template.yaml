AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lynia Finance - Serverless Microservices
  6 Lambda functions for Phase 2: Scoring, WhatsApp, KYC, Payment, Lock, Notification

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # VPC parameters (SecurityGroupId, SubnetIds) are typed as String with
        # empty defaults because VPC is optional (controlled by the UseVPC
        # condition).  cfn-lint cannot resolve the !If condition at lint time
        # so it incorrectly flags every Ref to these parameters as not matching
        # the sg-*/subnet-* patterns.
        - W1030
        # SAM creates implicit circular dependencies between API Gateway and
        # Lambda functions that have both API events and env var refs to the API.
        # CloudFormation resolves this during stack updates but not during fresh
        # stack creation. We break the cycle by using parameters for inter-service
        # URLs instead of !Ref LyniaApi in env vars.
        - E3004
        # cfn-lint static analysis flags the !If [IsProduction, <secret_resolve>, ""]
        # false-branch as unreachable when it evaluates with IsProduction=True.
        # Both branches are valid at deploy time depending on the Environment param.
        - W1028

# Global configuration for all functions
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Tracing: Active
    EphemeralStorage:
      Size: 512
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        DB_SECRET_NAME: !Sub "lynia/${Environment}/database"
        # DB credentials injected at deploy time by CloudFormation so that
        # Lambda functions never need to call Secrets Manager at runtime.
        # This is required because the VPC has an orphaned Route53 private
        # hosted zone for secretsmanager.us-east-1.amazonaws.com that returns
        # dead IPs, causing getSecret() to hang until Lambda timeout (30s).
        # Only injected for production (the secret exists only there).
        # Non-production environments fall through to the Secrets Manager path
        # in database.ts (which works because non-prod Lambdas are not in VPC).
        DB_HOST: !If
          - IsProduction
          - "{{resolve:secretsmanager:lynia/production/database:SecretString:host}}"
          - ""
        DB_PORT: !If
          - IsProduction
          - "{{resolve:secretsmanager:lynia/production/database:SecretString:port}}"
          - ""
        DB_NAME: !If
          - IsProduction
          - "{{resolve:secretsmanager:lynia/production/database:SecretString:database}}"
          - ""
        DB_USER: !If
          - IsProduction
          - "{{resolve:secretsmanager:lynia/production/database:SecretString:username}}"
          - ""
        DB_PASSWORD: !If
          - IsProduction
          - "{{resolve:secretsmanager:lynia/production/database:SecretString:password}}"
          - ""
        # Fineract credentials injected at deploy time for the same reason —
        # runtime getSecret() hangs in VPC due to orphaned DNS hosted zones.
        FINERACT_SECRET_NAME: !Sub "${Environment}/lynia/fineract-api"
        FINERACT_BASE_URL: !If
          - IsProduction
          - "{{resolve:secretsmanager:production/lynia/fineract-api:SecretString:base_url}}"
          - ""
        FINERACT_USERNAME: !If
          - IsProduction
          - "{{resolve:secretsmanager:production/lynia/fineract-api:SecretString:username}}"
          - ""
        FINERACT_PASSWORD: !If
          - IsProduction
          - "{{resolve:secretsmanager:production/lynia/fineract-api:SecretString:password}}"
          - ""
        FINERACT_TENANT_ID: !If
          - IsProduction
          - "{{resolve:secretsmanager:production/lynia/fineract-api:SecretString:tenant_id}}"
          - ""
        FINERACT_TLS_SERVERNAME: api.lyniafinance.com
        FINERACT_SMARTPHONE_PRODUCT_ID: !Ref FineractSmartphoneProductId
        LOG_LEVEL: info
        SECRETS_PREFIX: !Sub "${Environment}/lynia"
        API_STACK_NAME: !Sub "${AWS::StackName}"
    VpcConfig: !If
      - UseVPC
      - SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      - !Ref "AWS::NoValue"

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Deployment environment

  FineractSmartphoneProductId:
    Type: String
    Description: Fineract loan product ID for smartphone loans
    Default: "1"

  CognitoUserPoolArn:
    Type: String
    Description: Cognito User Pool ARN for API Gateway authorizer
    Default: ""

  WhatsAppPhoneNumberId:
    Type: String
    Description: WhatsApp Cloud API Phone Number ID
    NoEcho: true
    Default: ""

  WhatsAppAccessToken:
    Type: String
    Description: WhatsApp Cloud API Access Token
    NoEcho: true
    Default: ""

  WhatsAppWebhookVerifyToken:
    Type: String
    Description: WhatsApp Webhook Verification Token
    NoEcho: true
    Default: ""

  WhatsAppBusinessAccountId:
    Type: String
    Description: WhatsApp Business Account ID
    NoEcho: true
    Default: ""

  MetaAppSecret:
    Type: String
    Description: Meta App Secret for webhook HMAC signature validation
    NoEcho: true
    Default: ""

  SesSenderEmail:
    Type: String
    Description: SES verified sender email address for transfer notifications
    Default: "noreply@lynia.finance"

  DiditApiKey:
    Type: String
    Description: Didit KYC API Key
    NoEcho: true
    Default: ""

  DiditWebhookSecret:
    Type: String
    Description: Didit Webhook Secret for signature verification
    NoEcho: true
    Default: ""

  EcocashMerchantId:
    Type: String
    Description: EcoCash Merchant ID
    NoEcho: true
    Default: ""

  EcocashApiKey:
    Type: String
    Description: EcoCash API Key
    NoEcho: true
    Default: ""

  OnemoneyMerchantId:
    Type: String
    Description: OneMoney Merchant ID
    NoEcho: true
    Default: ""

  OnemoneyApiKey:
    Type: String
    Description: OneMoney API Key
    NoEcho: true
    Default: ""

  TrustonicApiKey:
    Type: String
    Description: Trustonic API Key
    NoEcho: true
    Default: ""

  TrustonicApiSecret:
    Type: String
    Description: Trustonic API Secret
    NoEcho: true
    Default: ""

  SmsProvider:
    Type: String
    Description: SMS Provider (twilio/africas_talking)
    Default: twilio
    AllowedValues:
      - twilio
      - africas_talking

  SmsApiKey:
    Type: String
    Description: SMS Provider API Key
    NoEcho: true
    Default: ""

  # Inter-service API URLs (passed as parameters to break circular dependencies)
  ScoringApiUrl:
    Type: String
    Description: URL for the scoring API endpoint (breaks circular dep with LyniaApi)
    Default: ""

  WhatsAppApiUrl:
    Type: String
    Description: URL for the WhatsApp send endpoint (breaks circular dep with LyniaApi)
    Default: ""

  KycApiUrl:
    Type: String
    Description: URL for the KYC API endpoint (breaks circular dep with LyniaApi)
    Default: ""

  # VPC Configuration (from VPC stack outputs)
  VpcEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable VPC configuration for Lambda functions

  PrivateSubnet1Id:
    Type: String
    Default: ""
    Description: Private Subnet 1 ID from VPC stack

  PrivateSubnet2Id:
    Type: String
    Default: ""
    Description: Private Subnet 2 ID from VPC stack

  LambdaSecurityGroupId:
    Type: String
    Default: "sg-00000000"
    AllowedPattern: "^sg-[a-fA-F0-9]{8,17}$"
    Description: Lambda Security Group ID from VPC stack

  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: Cognito User Pool ID for admin user management

  AlertSnsTopicArn:
    Type: String
    Default: ""
    Description: SNS Topic ARN for operational alerts (Fineract sync failures). Leave empty to disable alerting.

Conditions:
  UseVPC: !Equals [!Ref VpcEnabled, "true"]
  IsProduction: !Equals [!Ref Environment, "production"]
  HasCognitoPoolId: !Not [!Equals [!Ref CognitoUserPoolId, ""]]
  HasAlertSnsTopic: !Not [!Equals [!Ref AlertSnsTopicArn, ""]]

Resources:
  # =====================================================
  # API GATEWAY COGNITO AUTHORIZER
  # =====================================================
  LyniaApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${Environment}-lynia-api
      StageName: Prod
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          DataTraceEnabled: false
          LoggingLevel: "OFF"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  # =====================================================
  # 1. SCORING SERVICE
  # =====================================================
  ScoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-scoring-service
      CodeUri: services/
      Handler: scoring-service/src/index.handler
      Description: Credit scoring and loan assessment service
      MemorySize: 1024
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/fineract-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          SCORING_MODEL_VERSION: v1
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      # ReservedConcurrentExecutions: !If [IsProduction, 50, !Ref "AWS::NoValue"]  # Disabled - account concurrency limit too low
      Events:
        ScoringHealth:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /scoring/health
            Method: GET
            Auth:
              Authorizer: NONE
        CalculateScore:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /scoring/calculate
            Method: POST
            Auth:
              Authorizer: NONE
        GetScore:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /scoring/{customerId}
            Method: GET
            Auth:
              Authorizer: NONE
        # CreditScoringQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-credit-scoring"
        #     BatchSize: 5
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - scoring-service/src/index.ts

  # =====================================================
  # 2. WHATSAPP SERVICE
  # =====================================================
  WhatsAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-whatsapp-service
      CodeUri: services/
      Handler: whatsapp-service/src/index.handler
      Description: WhatsApp messaging and webhook service
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/whatsapp-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
          WHATSAPP_ACCESS_TOKEN: !Ref WhatsAppAccessToken
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: !Ref WhatsAppWebhookVerifyToken
          WHATSAPP_BUSINESS_ACCOUNT_ID: !Ref WhatsAppBusinessAccountId
          META_APP_SECRET: !Ref MetaAppSecret
          SCORING_API_URL: !Ref ScoringApiUrl
          KYC_API_URL: !Ref KycApiUrl
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      Events:
        WhatsAppHealth:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /whatsapp/health
            Method: GET
            Auth:
              Authorizer: NONE
        SendMessage:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /whatsapp/send
            Method: POST
        Webhook:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /whatsapp/webhook
            Method: POST
            Auth:
              Authorizer: NONE
        WebhookVerify:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /whatsapp/webhook
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - whatsapp-service/src/index.ts

  # =====================================================
  # 2b. WHATSAPP RETRY CONSUMER (SQS)
  # =====================================================
  WhatsAppRetryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-whatsapp-retry
      CodeUri: services/
      Handler: whatsapp-service/src/retry-consumer.handler
      Description: SQS consumer for retrying failed WhatsApp messages
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/whatsapp-*"
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-whatsapp-message-retry"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
          WHATSAPP_ACCESS_TOKEN: !Ref WhatsAppAccessToken
          ENVIRONMENT: !Ref Environment
      Events:
        WhatsAppRetryQueue:
          Type: SQS
          Properties:
            Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-whatsapp-message-retry"
            BatchSize: 5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - whatsapp-service/src/retry-consumer.ts

  # =====================================================
  # 3. KYC SERVICE
  # =====================================================
  KYCFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-kyc-service
      CodeUri: services/
      Handler: kyc-service/src/index.handler
      Description: KYC verification service (DIDIT integration)
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/didit-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/whatsapp-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-kyc-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          KYC_PROVIDER: didit
          DIDIT_API_KEY: !Ref DiditApiKey
          DIDIT_WEBHOOK_SECRET: !Ref DiditWebhookSecret
          WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
          WHATSAPP_ACCESS_TOKEN: !Ref WhatsAppAccessToken
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      Events:
        KYCHealth:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /kyc/health
            Method: GET
            Auth:
              Authorizer: NONE
        InitiateKYC:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /kyc/initiate
            Method: POST
            Auth:
              Authorizer: NONE
        KYCCallback:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /kyc/callback
            Method: POST
            Auth:
              Authorizer: NONE
        GetKYCStatus:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /kyc/{customerId}
            Method: GET
            Auth:
              Authorizer: NONE
        # KYCProcessingQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-kyc-processing"
        #     BatchSize: 5
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - kyc-service/src/index.ts

  # =====================================================
  # 4. PAYMENT SERVICE
  # =====================================================
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-payment-service
      CodeUri: services/
      Handler: payment-service/src/index.handler
      Description: Payment processing service (EcoCash, OneMoney integration)
      MemorySize: 1024
      Timeout: 60
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      # ReservedConcurrentExecutions: !If [IsProduction, 100, !Ref "AWS::NoValue"]  # Disabled - account concurrency limit too low
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/lynia/fineract-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/ecocash-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/onemoney-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-payment-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          ECOCASH_MERCHANT_ID: !Ref EcocashMerchantId
          ECOCASH_API_KEY: !Ref EcocashApiKey
          ONEMONEY_MERCHANT_ID: !Ref OnemoneyMerchantId
          ONEMONEY_API_KEY: !Ref OnemoneyApiKey
      Events:
        PaymentHealth:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/health
            Method: GET
            Auth:
              Authorizer: NONE
        InitiatePayment:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/initiate
            Method: POST
        WebhookEcoCash:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/webhook/ecocash
            Method: POST
            Auth:
              Authorizer: NONE
        WebhookOneMoney:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/webhook/onemoney
            Method: POST
            Auth:
              Authorizer: NONE
        WebhookOmari:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/webhook/omari
            Method: POST
            Auth:
              Authorizer: NONE
        WebhookInnBucks:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/webhook/innbucks
            Method: POST
            Auth:
              Authorizer: NONE
        GetPaymentStatus:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/{paymentId}
            Method: GET
        ReconcilePayments:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /payments/reconcile
            Method: POST
        # PaymentCallbackQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-payment-callbacks"
        #     BatchSize: 5
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        TreeShaking: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - payment-service/src/index.ts

  # =====================================================
  # 5. LOCK SERVICE
  # =====================================================
  LockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-lynia-lock-service
      CodeUri: services/
      Handler: lock-service/src/index.handler
      Description: Device lock/unlock service (Trustonic integration)
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/database-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lynia/${Environment}/trustonic-*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-device-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Environment:
        Variables:
          TRUSTONIC_API_KEY: !Ref TrustonicApiKey
          TRUSTONIC_API_SECRET: !Ref TrustonicApiSecret
      # AutoPublishAlias: live  # Temporarily disabled to avoid circular dependency
      Events:
        LockHealth:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /locks/health
            Method: GET
            Auth:
              Authorizer: NONE
        LockDevice:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /locks/lock
            Method: POST
        UnlockDevice:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /locks/unlock
            Method: POST
        GetLockStatus:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /locks/{deviceId}
            Method: GET
        ProcessScheduledLocks:
          Type: Api
          Properties:
            RestApiId: !Ref LyniaApi
            Path: /locks/process-scheduled
            Method: POST
        # DeviceLockQueue:
        #   Type: SQS
        #   Properties:
        #     Queue: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Environment}-lynia-device-locks"
        #     BatchSize: 5
        #     Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
